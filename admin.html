<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Quản lý lớp — Vật lý mẹ Cường</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#eef1f4; --surface:#ffffff; --ink:#18212b; --muted:#5d6b78;
    --line:#e2e7ec; --primary:#0b5fff; --primary-dark:#0847c4;
    --ok:#15803d; --warn:#b45309; --danger:#b42318;
    --radius:10px;
    font-family:'Be Vietnam Pro',system-ui,sans-serif;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);font-size:15px;line-height:1.5;
    padding-top:env(safe-area-inset-top,0);padding-bottom:env(safe-area-inset-bottom,0)}
  h1,h2,h3{margin:0;font-weight:600}
  button{font-family:inherit;cursor:pointer}
  input,select{font-family:inherit;font-size:14px}
  .hidden{display:none !important}

  /* Nút */
  .btn{border:1px solid var(--line);background:var(--surface);color:var(--ink);
    padding:8px 14px;border-radius:8px;font-size:14px;font-weight:500}
  .btn:hover{border-color:#c6cfd8}
  .btn-primary{background:var(--primary);border-color:var(--primary);color:#fff}
  .btn-primary:hover{background:var(--primary-dark);border-color:var(--primary-dark)}
  .btn-sm{padding:5px 10px;font-size:13px}
  .btn-ghost{background:transparent;border-color:transparent;color:var(--muted)}
  .btn-ghost:hover{color:var(--ink)}
  .btn-danger{color:var(--danger);border-color:#f0cfcb}
  .link{color:var(--primary);background:none;border:none;padding:0;font-size:14px}

  /* Đăng nhập */
  #loginView{min-height:100dvh;display:grid;place-items:center;padding:20px}
  .card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius)}
  .login-card{width:100%;max-width:360px;padding:28px}
  .login-card h1{font-size:20px;margin-bottom:4px}
  .login-card p.sub{color:var(--muted);font-size:14px;margin:0 0 20px}
  .field{margin-bottom:14px}
  .field label{display:block;font-size:13px;color:var(--muted);margin-bottom:5px}
  .field input{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:8px;outline:none}
  .field input:focus{border-color:var(--primary)}

  /* Khung ứng dụng */
  header.app{position:sticky;top:0;z-index:10;background:var(--surface);border-bottom:1px solid var(--line);
    display:flex;align-items:center;gap:12px;padding:12px 18px;padding-top:calc(12px + env(safe-area-inset-top,0))}
  header.app .title{font-size:16px;font-weight:600}
  header.app .spacer{flex:1}
  header.app .who{font-size:13px;color:var(--muted);text-align:right}
  .wrap{max-width:1000px;margin:0 auto;padding:18px}
  .nav{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:16px}
  .nav .group{display:flex;flex-direction:column;align-items:flex-start;gap:2px;
    padding:8px 12px;border:1px solid var(--line);background:var(--surface);border-radius:8px}
  .nav .group .n{font-weight:600;font-size:14px}
  .nav .group .c{font-size:12px;color:var(--muted)}
  .nav .group.active{border-color:var(--primary);box-shadow:inset 0 0 0 1px var(--primary)}

  .toolbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:12px}
  .toolbar .spacer{flex:1}
  .panel-title{font-size:15px;font-weight:600;margin-bottom:10px}

  table{width:100%;border-collapse:collapse;background:var(--surface);
    border:1px solid var(--line);border-radius:var(--radius);overflow:hidden}
  th,td{text-align:left;padding:8px 10px;border-bottom:1px solid var(--line);font-size:14px;vertical-align:middle}
  th{background:#f6f8fa;font-weight:600;color:var(--muted);font-size:12px}
  tr:last-child td{border-bottom:none}
  td input,td select{width:100%;padding:6px 8px;border:1px solid transparent;border-radius:6px;background:transparent}
  td input:hover,td select:hover{border-color:var(--line)}
  td input:focus,td select:focus{border-color:var(--primary);background:#fff;outline:none}
  td.sbd{font-variant-numeric:tabular-nums;color:var(--muted);white-space:nowrap}
  td.act{white-space:nowrap;text-align:right}
  .pill{font-size:12px;padding:2px 8px;border-radius:999px;white-space:nowrap}
  .pill.nghi{background:#fdeceb;color:var(--danger)}
  .pill.chuyen{background:#fff4e5;color:var(--warn)}
  tr.inactive td.sbd, tr.inactive td input{color:#9aa6b1}

  /* Lớp phủ */
  .overlay{position:fixed;inset:0;background:rgba(20,28,38,.45);display:grid;place-items:center;z-index:50;padding:16px}
  .modal{width:100%;max-width:440px;padding:22px;max-height:85dvh;overflow:auto}
  .modal h2{font-size:17px;margin-bottom:14px}
  .modal .row{display:flex;gap:8px;justify-content:flex-end;margin-top:18px}

  /* Toast */
  #toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);z-index:100;
    background:#18212b;color:#fff;padding:10px 16px;border-radius:8px;font-size:14px;opacity:0;
    transition:opacity .2s, transform .2s;pointer-events:none;max-width:90vw}
  #toast.show{opacity:1;transform:translateX(-50%) translateY(-4px)}
  #toast.err{background:var(--danger)}

  .notice{background:#fff7e6;border:1px solid #f3d99b;color:#8a5a00;padding:12px 14px;border-radius:8px;margin-bottom:16px;font-size:14px}
  .muted{color:var(--muted)}
  .pill.ok{background:#e8f6ee;color:var(--ok)}
  .pill.wait{background:#fff4e5;color:var(--warn)}
  .hubcard{padding:16px;margin-bottom:12px;max-width:720px}
  .hubcard h3{font-size:15px}
  .bar{height:10px;background:#e7ecf1;border-radius:999px;overflow:hidden;margin:8px 0 10px}
  .bar>div{height:100%;background:var(--primary);width:0;transition:width .2s}
  .issue{display:flex;gap:8px;padding:8px 0;border-bottom:1px solid var(--line);font-size:14px}
  .issue:last-child{border-bottom:none}
  .issue .t{font-weight:600;min-width:150px}

  @media(max-width:600px){
    td.lop-col,th.lop-col{display:none}
    .wrap{padding:12px}
  }
</style>
</head>
<body>

<!-- ĐĂNG NHẬP -->
<div id="loginView" class="hidden">
  <div class="card login-card">
    <h1>Quản lý lớp</h1>
    <p class="sub">Vật lý mẹ Cường</p>
    <div id="configWarn" class="notice hidden">Chưa cấu hình URL máy chủ trong <code>config.js</code>.</div>
    <div class="field">
      <label for="u">Tài khoản</label>
      <input id="u" autocomplete="username" autocapitalize="off">
    </div>
    <div class="field">
      <label for="p">Mật khẩu</label>
      <input id="p" type="password" autocomplete="current-password">
    </div>
    <button id="loginBtn" class="btn btn-primary" style="width:100%">Đăng nhập</button>
  </div>
</div>

<!-- ỨNG DỤNG -->
<div id="appView" class="hidden">
  <header class="app">
    <span class="title">Quản lý lớp</span>
    <span class="spacer"></span>
    <span class="who" id="whoami"></span>
    <button class="btn btn-sm" id="pwBtn">Đổi mật khẩu</button>
    <button class="btn btn-sm" id="logoutBtn">Thoát</button>
  </header>
  <div class="wrap">
    <div class="toolbar">
      <button class="btn btn-sm" id="usersBtn">Tài khoản & giáo viên</button>
      <button class="btn btn-sm" id="examsBtn">Bài kiểm tra</button>
      <button class="btn btn-sm" id="syncBtn">Đồng bộ nhóm</button>
      <button class="btn btn-sm" id="validateBtn">Kiểm tra danh sách</button>
      <span class="spacer"></span>
      <button class="btn btn-sm" id="reloadBtn">Tải lại</button>
    </div>

    <!-- Màn nhóm/học sinh -->
    <div id="rosterScreen">
      <div class="nav" id="groupNav"></div>
      <div id="studentsArea"></div>
    </div>

    <!-- Màn tài khoản (admin) -->
    <div id="usersScreen" class="hidden"></div>

    <!-- Màn bài kiểm tra -->
    <div id="examsScreen" class="hidden"></div>
  </div>
</div>

<div id="overlayRoot"></div>
<div id="toast"></div>

<script src="https://cdn.jsdelivr.net/npm/pdfjs-dist@3.11.174/build/pdf.min.js"></script>
<script>if(window.pdfjsLib){pdfjsLib.GlobalWorkerOptions.workerSrc='https://cdn.jsdelivr.net/npm/pdfjs-dist@3.11.174/build/pdf.worker.min.js';}</script>
<script src="config.js"></script>
<script src="api.js"></script>
<script>
const $ = s => document.querySelector(s);
let GROUPS = [], CUR = null, USER = null;

function toast(msg, isErr){
  const t = $('#toast'); t.textContent = msg; t.className = 'show' + (isErr?' err':'');
  setTimeout(()=>{ t.className = isErr?'err':''; }, isErr?3500:2000);
}
function esc(s){ return String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }

/* ---------- Khởi động ---------- */
function init(){
  if(!window.APP_CONFIG || !window.APP_CONFIG.API_URL || window.APP_CONFIG.API_URL.indexOf('http')!==0){
    $('#loginView').classList.remove('hidden'); $('#configWarn').classList.remove('hidden'); return;
  }
  USER = getUser();
  if(USER && localStorage.getItem('token')) showApp();
  else showLogin();
}
function showLogin(){ $('#appView').classList.add('hidden'); $('#loginView').classList.remove('hidden'); $('#u').focus(); }
async function showApp(){
  $('#loginView').classList.add('hidden'); $('#appView').classList.remove('hidden');
  $('#whoami').textContent = USER.fullName + ' · ' + (USER.role==='admin'?'Quản trị':'Giáo viên');
  $('#usersBtn').classList.toggle('hidden', USER.role!=='admin');
  $('#syncBtn').classList.toggle('hidden', USER.role==='admin');
  $('#examsBtn').classList.toggle('hidden', USER.role==='admin');
  openRoster();
  await loadGroups();
}

/* ---------- Đăng nhập ---------- */
$('#loginBtn').onclick = async ()=>{
  const username = $('#u').value.trim(), password = $('#p').value;
  if(!username || !password){ toast('Nhập tài khoản và mật khẩu', true); return; }
  $('#loginBtn').disabled = true;
  try{
    const r = await apiCall('login', {username, password});
    setSession(r.token, r.user); USER = r.user;
    if(r.user.mustChange){ await showApp(); openChangePw(true); }
    else await showApp();
  }catch(e){ toast(e.message, true); }
  finally{ $('#loginBtn').disabled = false; }
};
$('#p').addEventListener('keydown', e=>{ if(e.key==='Enter') $('#loginBtn').click(); });

$('#logoutBtn').onclick = async ()=>{
  try{ await apiCall('logout'); }catch(e){}
  clearSession(); USER=null; GROUPS=[]; CUR=null; showLogin();
};

/* ---------- Nhóm & học sinh ---------- */
function openRoster(){ $('#rosterScreen').classList.remove('hidden'); $('#usersScreen').classList.add('hidden'); $('#examsScreen').classList.add('hidden'); }
$('#reloadBtn').onclick = ()=>{ if($('#usersScreen').classList.contains('hidden')){ loadGroups(); } else { openUsers(); } };

async function loadGroups(){
  $('#groupNav').innerHTML = '<span class="muted">Đang tải nhóm…</span>';
  try{
    const r = await apiCall('listGroups');
    GROUPS = r.groups;
    renderGroupNav();
    if(GROUPS.length){ if(!CUR || !GROUPS.find(g=>g.maNhom===CUR)) CUR = GROUPS[0].maNhom; selectGroup(CUR); }
    else $('#studentsArea').innerHTML = '<p class="muted">Chưa có nhóm nào.</p>';
  }catch(e){ handleErr(e); }
}
function renderGroupNav(){
  $('#groupNav').innerHTML = GROUPS.map(g=>`
    <button class="group ${g.maNhom===CUR?'active':''}" data-m="${g.maNhom}">
      <span class="n">${esc(g.tenNhom)}</span>
      <span class="c">${g.active} đang học · ${g.total} tổng · ${g.maNhom}</span>
    </button>`).join('');
  document.querySelectorAll('#groupNav .group').forEach(b=> b.onclick = ()=>{ CUR=b.dataset.m; renderGroupNav(); selectGroup(CUR); });
}

async function selectGroup(maNhom){
  $('#studentsArea').innerHTML = '<p class="muted">Đang tải học sinh…</p>';
  try{
    const r = await apiCall('listStudents', {maNhom});
    renderStudents(r);
  }catch(e){ handleErr(e); }
}

function renderStudents(data){
  const rows = data.students.map(s=>{
    const inactive = s.trangThai!=='Đang học';
    let pill = '';
    if(s.trangThai==='Đã nghỉ') pill = '<span class="pill nghi">Đã nghỉ</span>';
    else if(s.trangThai==='Đã chuyển') pill = '<span class="pill chuyen">Đã chuyển</span>';
    return `<tr class="${inactive?'inactive':''}" data-sbd="${s.sbd}">
      <td class="sbd">${esc(s.sbd)}${s.sbdCu?'<br><span class="muted" style="font-size:11px">cũ: '+esc(s.sbdCu)+'</span>':''}</td>
      <td><input class="f-ho" value="${esc(s.ho)}"></td>
      <td><input class="f-ten" value="${esc(s.ten)}"></td>
      <td class="lop-col"><input class="f-lop" value="${esc(s.lop)}" style="max-width:70px"></td>
      <td>
        <select class="f-status">
          <option ${s.trangThai==='Đang học'?'selected':''}>Đang học</option>
          <option ${s.trangThai==='Đã nghỉ'?'selected':''}>Đã nghỉ</option>
          ${s.trangThai==='Đã chuyển'?'<option selected>Đã chuyển</option>':''}
        </select>
      </td>
      <td class="act">${pill}
        <button class="btn btn-sm save">Lưu</button>
        <button class="btn btn-sm transfer">Chuyển</button>
      </td>
    </tr>`;
  }).join('');

  $('#studentsArea').innerHTML = `
    <div class="panel-title">${esc(data.tenNhom)} <span class="muted" style="font-weight:400">(${data.students.length} học sinh)</span></div>
    <table>
      <thead><tr><th>SBD</th><th>Họ</th><th>Tên</th><th class="lop-col">Lớp</th><th>Trạng thái</th><th></th></tr></thead>
      <tbody id="stBody">${rows}</tbody>
      <tfoot><tr class="addrow">
        <td class="sbd muted">tự cấp</td>
        <td><input id="new-ho" placeholder="Họ"></td>
        <td><input id="new-ten" placeholder="Tên"></td>
        <td class="lop-col"><input id="new-lop" placeholder="Lớp" style="max-width:70px"></td>
        <td></td>
        <td class="act"><button class="btn btn-sm btn-primary" id="addBtn">Thêm học sinh</button></td>
      </tr></tfoot>
    </table>`;

  document.querySelectorAll('#stBody tr').forEach(tr=>{
    const sbd = tr.dataset.sbd;
    tr.querySelector('.save').onclick = ()=> saveStudent(tr, sbd);
    tr.querySelector('.transfer').onclick = ()=> openTransfer(sbd, tr);
    tr.querySelector('.f-status').onchange = (e)=> changeStatus(sbd, e.target.value);
  });
  $('#addBtn').onclick = addStudent;
}

async function saveStudent(tr, sbd){
  const ho = tr.querySelector('.f-ho').value.trim();
  const ten = tr.querySelector('.f-ten').value.trim();
  const lop = tr.querySelector('.f-lop') ? tr.querySelector('.f-lop').value.trim() : '';
  try{
    await apiCall('upsertStudent', {maNhom:CUR, sbd, ho, ten, lop});
    toast('Đã lưu ' + sbd);
  }catch(e){ handleErr(e); }
}
async function changeStatus(sbd, trangThai){
  try{ await apiCall('setStudentStatus', {maNhom:CUR, sbd, trangThai}); toast('Đã đổi trạng thái'); loadGroups(); selectGroup(CUR); }
  catch(e){ handleErr(e); }
}
async function addStudent(){
  const ho = $('#new-ho').value.trim(), ten = $('#new-ten').value.trim(), lop = ($('#new-lop')||{}).value || '';
  if(!ho && !ten){ toast('Nhập họ tên', true); return; }
  try{
    const r = await apiCall('upsertStudent', {maNhom:CUR, ho, ten, lop:lop.trim()});
    toast('Đã thêm, SBD ' + r.sbd);
    loadGroups(); selectGroup(CUR);
  }catch(e){ handleErr(e); }
}

/* ---------- Chuyển nhóm ---------- */
function openTransfer(sbd){
  const others = GROUPS.filter(g=>g.maNhom!==CUR);
  if(!others.length){ toast('Không có nhóm khác để chuyển', true); return; }
  const opts = others.map(g=>`<option value="${g.maNhom}">${esc(g.tenNhom)} (${g.maNhom})</option>`).join('');
  overlay(`
    <h2>Chuyển nhóm cho ${esc(sbd)}</h2>
    <p class="muted" style="font-size:13px;margin:0 0 12px">Em sẽ được cấp SBD mới ở nhóm đến; SBD cũ được giữ làm lịch sử, dòng cũ chuyển sang "Đã chuyển".</p>
    <div class="field"><label>Chuyển sang nhóm</label><select id="trTo" style="width:100%;padding:10px;border:1px solid var(--line);border-radius:8px">${opts}</select></div>
    <div class="row"><button class="btn" onclick="closeOverlay()">Hủy</button><button class="btn btn-primary" id="trGo">Chuyển</button></div>
  `);
  $('#trGo').onclick = async ()=>{
    const toMaNhom = $('#trTo').value;
    try{ const r = await apiCall('transferStudent', {fromMaNhom:CUR, sbd, toMaNhom}); closeOverlay(); toast('Đã chuyển, SBD mới ' + r.newSbd); loadGroups(); selectGroup(CUR); }
    catch(e){ handleErr(e); }
  };
}

/* ---------- Đồng bộ nhóm ---------- */
$('#syncBtn').onclick = async ()=>{
  try{
    const r = await apiCall('syncGroups');
    showSyncReport(r);
    loadGroups();
  }catch(e){ handleErr(e); }
};
function showSyncReport(r){
  const reg = (r.registered||[]).map(x=>esc(x.maNhom)+' '+esc(x.tenNhom)).join(', ') || '(không có)';
  const con = (r.conflicts||[]).map(x=>`<div class="issue"><span class="t">${esc(x.maNhom)} ${esc(x.tenNhom)}</span><span>${esc(x.lyDo)}</span></div>`).join('');
  overlay(`<h2>Kết quả đồng bộ</h2>
    <p style="font-size:14px"><b>Đã đăng ký:</b> ${reg}</p>
    ${con?('<p style="font-size:14px;margin-top:10px"><b>Bỏ qua (cần xử lý):</b></p>'+con):'<p class="muted" style="font-size:14px">Không có nhóm nào bị bỏ qua.</p>'}
    <div class="row"><button class="btn" onclick="closeOverlay()">Đóng</button></div>`);
}

/* ---------- Kiểm tra danh sách ---------- */
$('#validateBtn').onclick = async ()=>{
  overlay('<h2>Kiểm tra danh sách</h2><p class="muted">Đang kiểm tra…</p>');
  try{
    const r = await apiCall('validateRoster');
    let body;
    if(r.ok) body = '<p style="color:var(--ok)">Không phát hiện vấn đề.</p>';
    else body = r.issues.map(i=>`<div class="issue"><span class="t">${esc(i.type)}</span><span>${esc(i.group)} — ${esc(i.detail)}</span></div>`).join('');
    overlay(`<h2>Kiểm tra danh sách</h2><div>${body}</div><div class="row"><button class="btn" onclick="closeOverlay()">Đóng</button></div>`);
  }catch(e){ closeOverlay(); handleErr(e); }
};

/* ---------- Đổi mật khẩu ---------- */
$('#pwBtn').onclick = ()=> openChangePw(false);
function openChangePw(forced){
  overlay(`
    <h2>Đổi mật khẩu</h2>
    ${forced?'<p class="muted" style="font-size:13px;margin:0 0 12px">Đây là lần đăng nhập đầu, hãy đặt mật khẩu mới.</p>':''}
    <div class="field"><label>Mật khẩu hiện tại</label><input id="oldPw" type="password" style="width:100%;padding:10px;border:1px solid var(--line);border-radius:8px"></div>
    <div class="field"><label>Mật khẩu mới (tối thiểu 6 ký tự)</label><input id="newPw" type="password" style="width:100%;padding:10px;border:1px solid var(--line);border-radius:8px"></div>
    <div class="row">${forced?'':'<button class="btn" onclick="closeOverlay()">Hủy</button>'}<button class="btn btn-primary" id="pwGo">Lưu</button></div>
  `, forced);
  $('#pwGo').onclick = async ()=>{
    const oldPassword = $('#oldPw').value, newPassword = $('#newPw').value;
    try{ await apiCall('changePassword', {oldPassword, newPassword}); closeOverlay(); toast('Đã đổi mật khẩu'); }
    catch(e){ toast(e.message, true); }
  };
}

/* ---------- Tài khoản (admin) ---------- */
$('#usersBtn').onclick = openUsers;
function dai(u){
  if(u.rangeStart===''||u.rangeStart===undefined||u.rangeStart===null) return '—';
  const p3 = n => ('00'+parseInt(n,10)).slice(-3);
  return p3(u.rangeStart)+'–'+p3(u.rangeEnd);
}
async function openUsers(){
  $('#rosterScreen').classList.add('hidden'); $('#examsScreen').classList.add('hidden'); $('#usersScreen').classList.remove('hidden');
  $('#usersScreen').innerHTML = '<p class="muted">Đang tải…</p>';
  try{
    const r = await apiCall('listUsers');
    const rows = r.users.map(u=>{
      const isTeacher = u.role==='teacher';
      return `<tr>
      <td>${esc(u.username)}</td><td>${esc(u.fullName)}</td>
      <td>${u.role==='admin'?'Quản trị':'Giáo viên'}</td>
      <td>${isTeacher?esc(dai(u)):'—'}</td>
      <td>${u.active?'<span style="color:var(--ok)">Hoạt động</span>':'<span style="color:var(--danger)">Đã khóa</span>'}</td>
      <td class="act">

/* ================= BÀI KIỂM TRA ================= */
let EX = { bai:null, cfg:null, ans:{}, curMaDe:null };

$('#examsBtn').onclick = openExams;

}

    const r = await apiCall('listBai');

function blankCfg(){
  return { p1:{on:true,soCau:18,diem:4.5}, p2:{on:true,soCau:4,d1:0.1,d2:0.25,d3:0.5,d4:1.0}, p3:{on:true,soCau:6,diem:1.5}, maDeList:[] };
}
function cfgTotal(c){
  let t=0;
  if(c.p1.on) t+=Number(c.p1.diem)||0;
  if(c.p2.on) t+=(Number(c.p2.soCau)||0)*(Number(c.p2.d4)||0);
  if(c.p3.on) t+=Number(c.p3.diem)||0;
  return t;
}

async function startConfig(maBai, preloaded){
  // maBai null = tạo mới; nếu có = sửa cấu hình bài cũ
  EX = { bai:null, cfg:blankCfg(), ans:{}, curMaDe:null };
  let groups=[];
  try{ groups = (await apiCall('listGroups')).groups; }catch(e){ handleErr(e); return; }
  if(maBai){
    try{ const b = preloaded || await apiCall('getBai',{maBai}); EX.bai=b; EX.cfg=b.cauHinh; EX.ans=b.dapAn||{}; }catch(e){ handleErr(e); return; }
  }
  renderConfig(groups);
}

function renderConfig(groups){
  const c = EX.cfg;
  const checkedNhom = new Set((EX.bai?EX.bai.cacNhom:[]));
  const nhomBoxes = groups.map(g=>`<label style="display:inline-flex;align-items:center;gap:6px;margin:4px 10px 4px 0">
     <input type="checkbox" class="exNhom" value="${esc(g.maNhom)}" ${checkedNhom.has(g.maNhom)?'checked':''}> ${esc(g.tenNhom)}</label>`).join('');
  function partRow(key,label,fields){ return fields; }
  $('#examsScreen').innerHTML = `
    <div class="toolbar"><button class="btn btn-sm" id="exCancel">← Hủy</button>
      <span class="panel-title" style="margin:0 8px">${EX.bai?'Sửa bài':'Tạo bài mới'}</span></div>
    <div class="card" style="padding:18px;max-width:640px">
      <div class="field"><label>Tên bài</label><input id="cfgTen" value="${EX.bai?esc(EX.bai.tenBai):''}" style="width:100%;padding:10px;border:1px solid var(--line);border-radius:8px"></div>
      <div class="field"><label>Ngày kiểm tra</label><input id="cfgNgay" type="date" value="${EX.bai?esc(EX.bai.ngay):''}" style="padding:10px;border:1px solid var(--line);border-radius:8px"></div>
      <div class="field"><label>Nhóm làm bài</label><div>${nhomBoxes||'<span class="muted">Chưa có nhóm</span>'}</div></div>

      <div class="field" style="border-top:1px solid var(--line);padding-top:12px">
        <label style="display:flex;align-items:center;gap:8px"><input type="checkbox" id="p1on" ${c.p1.on?'checked':''}> <b>Phần I — trắc nghiệm A/B/C/D</b></label>
        <div style="display:flex;gap:8px;margin-top:6px">
          <div style="flex:1"><label>Số câu</label><input id="p1n" type="number" min="0" value="${c.p1.soCau}" style="width:100%;padding:8px;border:1px solid var(--line);border-radius:8px"></div>
          <div style="flex:1"><label>Tổng điểm phần</label><input id="p1d" type="number" step="0.05" value="${c.p1.diem}" style="width:100%;padding:8px;border:1px solid var(--line);border-radius:8px"></div>
        </div>
      </div>

      <div class="field">
        <label style="display:flex;align-items:center;gap:8px"><input type="checkbox" id="p2on" ${c.p2.on?'checked':''}> <b>Phần II — đúng/sai 4 ý</b></label>
        <div style="display:flex;gap:8px;margin-top:6px;flex-wrap:wrap">
          <div style="flex:1;min-width:90px"><label>Số câu</label><input id="p2n" type="number" min="0" value="${c.p2.soCau}" style="width:100%;padding:8px;border:1px solid var(--line);border-radius:8px"></div>
          <div style="flex:1;min-width:70px"><label>Đúng 1 ý</label><input id="p2d1" type="number" step="0.05" value="${c.p2.d1}" style="width:100%;padding:8px;border:1px solid var(--line);border-radius:8px"></div>
          <div style="flex:1;min-width:70px"><label>2 ý</label><input id="p2d2" type="number" step="0.05" value="${c.p2.d2}" style="width:100%;padding:8px;border:1px solid var(--line);border-radius:8px"></div>
          <div style="flex:1;min-width:70px"><label>3 ý</label><input id="p2d3" type="number" step="0.05" value="${c.p2.d3}" style="width:100%;padding:8px;border:1px solid var(--line);border-radius:8px"></div>
          <div style="flex:1;min-width:70px"><label>4 ý</label><input id="p2d4" type="number" step="0.05" value="${c.p2.d4}" style="width:100%;padding:8px;border:1px solid var(--line);border-radius:8px"></div>
        </div>
      </div>

      <div class="field">
        <label style="display:flex;align-items:center;gap:8px"><input type="checkbox" id="p3on" ${c.p3.on?'checked':''}> <b>Phần III — trả lời ngắn (số)</b></label>
        <div style="display:flex;gap:8px;margin-top:6px">
          <div style="flex:1"><label>Số câu</label><input id="p3n" type="number" min="0" value="${c.p3.soCau}" style="width:100%;padding:8px;border:1px solid var(--line);border-radius:8px"></div>
          <div style="flex:1"><label>Tổng điểm phần</label><input id="p3d" type="number" step="0.05" value="${c.p3.diem}" style="width:100%;padding:8px;border:1px solid var(--line);border-radius:8px"></div>
        </div>
      </div>

      <div class="field" style="border-top:1px solid var(--line);padding-top:12px">
        <label>Mã đề (cách nhau bởi dấu phẩy, ví dụ 1,2,3,4 → 001…)</label>
        <input id="cfgMaDe" value="${(EX.cfg.maDeList||[]).join(', ')}" placeholder="1, 2, 3, 4" style="width:100%;padding:10px;border:1px solid var(--line);border-radius:8px">
      </div>

      <div style="display:flex;align-items:center;gap:12px;margin-top:8px">
        <div>Tổng điểm tối đa: <b id="cfgTotal">0</b> / 10</div>
        <span class="spacer" style="flex:1"></span>
        <button class="btn btn-primary" id="cfgNext">Tiếp tục nhập đáp án</button>
      </div>
    </div>`;
  $('#exCancel').onclick = openExams;
  const recompute = ()=>{
    EX.cfg = readConfigForm();
    $('#cfgTotal').textContent = cfgTotal(EX.cfg).toFixed(2);
  };
  ['p1on','p1n','p1d','p2on','p2n','p2d1','p2d2','p2d3','p2d4','p3on','p3n','p3d'].forEach(id=> $('#'+id).addEventListener('input', recompute));
  recompute();
  $('#cfgNext').onclick = saveConfigAndGoAnswers;
}

function readConfigForm(){
  const num = id => Number($('#'+id).value)||0;
  const mad = $('#cfgMaDe').value.split(',').map(s=>s.trim()).filter(Boolean).map(s=>/^\d+$/.test(s)?('00'+parseInt(s,10)).slice(-3):s);
  return {
    p1:{on:$('#p1on').checked, soCau:num('p1n'), diem:num('p1d')},
    p2:{on:$('#p2on').checked, soCau:num('p2n'), d1:num('p2d1'),d2:num('p2d2'),d3:num('p2d3'),d4:num('p2d4')},
    p3:{on:$('#p3on').checked, soCau:num('p3n'), diem:num('p3d')},
    maDeList: mad
  };
}

async function saveConfigAndGoAnswers(){
  EX.cfg = readConfigForm();
  const cacNhom = Array.from(document.querySelectorAll('.exNhom:checked')).map(x=>x.value);
  const tenBai = $('#cfgTen').value.trim();
  const ngay = $('#cfgNgay').value;
  if(!tenBai){ toast('Nhập tên bài', true); return; }
  if(Math.abs(cfgTotal(EX.cfg)-10)>0.01){ toast('Tổng điểm phải bằng 10', true); return; }
  if(!EX.cfg.maDeList.length){ toast('Nhập ít nhất 1 mã đề', true); return; }
  try{
    if(EX.bai){
      await apiCall('updateBai',{maBai:EX.bai.maBai, tenBai, ngay, cacNhom, cauHinh:EX.cfg});
      EX.bai = await apiCall('getBai',{maBai:EX.bai.maBai});
    } else {
      const r = await apiCall('createBai',{tenBai, ngay, cacNhom, cauHinh:EX.cfg});
      EX.bai = await apiCall('getBai',{maBai:r.maBai});
    }
    EX.cfg = EX.bai.cauHinh; EX.ans = EX.bai.dapAn||{};
    EX.curMaDe = EX.cfg.maDeList[0];
    renderAnswers();
  }catch(e){ toast(e.message, true); }
}

function ensureAns(md){
  if(!EX.ans[md]) EX.ans[md]={p1:[],p2:[],p3:[]};
  if(!EX.ans[md].p1) EX.ans[md].p1=[];
  if(!EX.ans[md].p2) EX.ans[md].p2=[];
  if(!EX.ans[md].p3) EX.ans[md].p3=[];
  return EX.ans[md];
}

function renderAnswers(){
  const c = EX.cfg, md = EX.curMaDe;
  const tabs = c.maDeList.map(x=>`<button class="btn btn-sm ${x===md?'btn-primary':''}" data-md="${esc(x)}">${esc(x)}</button>`).join(' ');
  const a = ensureAns(md);
  let html = '';

  if(c.p1.on){
    let rows='';
    for(let i=0;i<c.p1.soCau;i++){
      const sel=a.p1[i]||'';
      rows += `<div class="arow"><span class="cn">${i+1}</span>${['A','B','C','D'].map(L=>`<button class="seg ${sel===L?'on':''}" data-p="p1" data-i="${i}" data-v="${L}">${L}</button>`).join('')}</div>`;
    }
    html += `<h3 style="margin:14px 0 6px">Phần I</h3><div class="agrid">${rows}</div>`;
  }
  if(c.p2.on){
    let rows='';
    for(let i=0;i<c.p2.soCau;i++){
      const s=(a.p2[i]||'____').padEnd(4,'_').slice(0,4);
      const yrow = [0,1,2,3].map(k=>{
        const v=s[k];
        return `<span class="yrow"><b>${'abcd'[k]}</b>`+
          `<button class="seg ${v==='Đ'?'on':''}" data-p="p2" data-i="${i}" data-k="${k}" data-v="Đ">Đ</button>`+
          `<button class="seg ${v==='S'?'on':''}" data-p="p2" data-i="${i}" data-k="${k}" data-v="S">S</button></span>`;
      }).join('');
      rows += `<div class="arow p2row"><span class="cn">${i+1}</span>${yrow}</div>`;
    }
    html += `<h3 style="margin:14px 0 6px">Phần II</h3><div class="agrid">${rows}</div>`;
  }
  if(c.p3.on){
    let rows='';
    for(let i=0;i<c.p3.soCau;i++){
      rows += `<div class="arow"><span class="cn">${i+1}</span><input class="p3in" data-i="${i}" value="${esc(a.p3[i]||'')}" placeholder="vd 8 hoặc 0,31" style="padding:6px 8px;border:1px solid var(--line);border-radius:6px;max-width:140px"></div>`;
    }
    html += `<h3 style="margin:14px 0 6px">Phần III</h3><div class="agrid">${rows}</div>`;
  }

  $('#examsScreen').innerHTML = `
    <style>
      .agrid{display:flex;flex-wrap:wrap;gap:6px 18px}
      .arow{display:flex;align-items:center;gap:4px}
      .arow .cn{display:inline-block;min-width:26px;color:var(--muted);text-align:right;font-size:13px}
      .seg{border:1px solid var(--line);background:#fff;border-radius:6px;padding:4px 9px;font-size:13px;font-weight:600}
      .seg.on{background:var(--primary);border-color:var(--primary);color:#fff}
      .p2row{width:100%}
      .yrow{display:inline-flex;align-items:center;gap:3px;margin-right:8px}
      .yrow b{font-weight:600;color:var(--muted);margin-right:2px}
    </style>
    <div class="toolbar"><button class="btn btn-sm" id="ansHub">← Trang bài</button><button class="btn btn-sm" id="ansBack">Sửa cấu hình</button>
      <span class="panel-title" style="margin:0 8px">${esc(EX.bai.tenBai)} — nhập đáp án</span></div>
    <div class="toolbar"><span class="muted" style="margin-right:6px">Mã đề:</span>${tabs}
      <span class="spacer"></span>
      <button class="btn btn-sm" id="ansPaste">Dán nhanh mã ${esc(md)}</button></div>
    <div class="card" style="padding:16px">${html}</div>
    <div class="toolbar" style="margin-top:12px">
      <button class="btn btn-primary" id="ansSave">Lưu đáp án</button>
      <button class="btn" id="ansGen">Sinh file đáp án cho TNMaker</button>
      <span class="spacer"></span>
      <span id="ansFileLink"></span>
    </div>`;

  $('#ansBack').onclick = ()=> startConfig(EX.bai.maBai);
  $('#ansHub').onclick = ()=>{ if(confirm('Đáp án chưa bấm Lưu sẽ mất. Quay về trang bài?')) openBai(EX.bai.maBai); };
  document.querySelectorAll('#examsScreen [data-md]').forEach(b=> b.onclick=()=>{ collectVisible(); EX.curMaDe=b.dataset.md; renderAnswers(); });
  document.querySelectorAll('#examsScreen .seg[data-p="p1"]').forEach(b=> b.onclick=()=>{ collectVisible(); const a=ensureAns(md); a.p1[+b.dataset.i]=b.dataset.v; renderAnswers(); });
  document.querySelectorAll('#examsScreen .seg[data-p="p2"]').forEach(b=> b.onclick=()=>{
    collectVisible(); const a=ensureAns(md); let s=(a.p2[+b.dataset.i]||'____').padEnd(4,'_').split('');
    s[+b.dataset.k]=b.dataset.v; a.p2[+b.dataset.i]=s.join(''); renderAnswers();
  });
  $('#ansPaste').onclick = ()=> openPaste(md);
  $('#ansSave').onclick = saveAnswers;
  $('#ansGen').onclick = genFile;
  if(EX.bai.dapAnFile) showFileLink(EX.bai.dapAnFile);
}

function collectVisible(){
  const md = EX.curMaDe; const a = ensureAns(md);
  document.querySelectorAll('#examsScreen .p3in').forEach(inp=>{ a.p3[+inp.dataset.i]=inp.value.trim(); });
}

function openPaste(md){
  const c=EX.cfg;
  overlay(`
    <h2>Dán nhanh đáp án mã ${esc(md)}</h2>
    ${c.p1.on?`<div class="field"><label>Phần I — ${c.p1.soCau} câu, dán liền (vd BACDA…)</label><input id="pz1" style="width:100%;padding:10px;border:1px solid var(--line);border-radius:8px"></div>`:''}

    ${c.p3.on?`<div class="field"><label>Phần III — ${c.p3.soCau} câu, cách nhau bởi dấu cách (vd 8 0,31 157 …)</label><input id="pz3" style="width:100%;padding:10px;border:1px solid var(--line);border-radius:8px"></div>`:''}
    <div class="row"><button class="btn" onclick="closeOverlay()">Hủy</button><button class="btn btn-primary" id="pzGo">Áp dụng</button></div>
  `);
  $('#pzGo').onclick = ()=>{
    const a=ensureAns(md);
    if(c.p1.on && $('#pz1')){ const s=$('#pz1').value.toUpperCase().replace(/[^ABCD]/g,''); a.p1=s.split('').slice(0,c.p1.soCau); }

    if(c.p3.on && $('#pz3')){ a.p3=$('#pz3').value.split(/[\s;]+/).map(x=>x.trim()).filter(Boolean).slice(0,c.p3.soCau); }
    closeOverlay(); renderAnswers();
  };
}

  $('#hubBack').onclick = renderBaiList;

/* >>> UPLOAD-QUEUE */
const sleep = ms => new Promise(r=>setTimeout(r, ms));
async function uploadWithRetry(uploadFn, item, data, state){
  const tries = state.tries || 3;
  const back = state.backoffMs == null ? 800 : state.backoffMs;
  for(let t=0; t<tries; t++){
    if(state.cancel) return false;
    try{ await uploadFn(item, data); return true; }
    catch(e){
      const msg = (e && e.message) || String(e);
      state.lastError = msg;
      if(/Phiên đã hết hạn/.test(msg)){ state.authLost = true; state.cancel = true; return false; }
      if(t === tries-1) return false;
      await sleep(back*(t+1));
    }
  }
  return false;
}
async function runUploadQueue(items, renderFn, uploadFn, state){
  const conc = state.concurrency || 3;
  const prog = ()=>{ try{ if(state.onProgress) state.onProgress(); }catch(e){} };
  const active = new Set();
  for(const item of items){
    if(state.cancel) break;
    while(active.size >= conc) await Promise.race(active);
    if(state.cancel) break;
    let data;
    try{ data = await renderFn(item); }
    catch(e){ state.failed.push({item, data:null}); state.lastError = 'Không vẽ được trang '+item.name; prog(); continue; }
    const pr = uploadWithRetry(uploadFn, item, data, state).then(ok=>{
      if(ok) state.done++; else state.failed.push({item, data});
      active.delete(pr);
      prog();
    });
    active.add(pr);
  }
  await Promise.all(Array.from(active));
}
/* <<< UPLOAD-QUEUE */

async function renderPreview(canvas, doc, extra){
  const page = await doc.getPage(1);
  const rot = (((page.rotate + extra) % 360) + 360) % 360;
  const base = page.getViewport({scale:1, rotation:rot});
  const vp = page.getViewport({scale:260/base.width, rotation:rot});
  canvas.width = Math.round(vp.width); canvas.height = Math.round(vp.height);
  const ctx = canvas.getContext('2d');
  ctx.fillStyle = '#fff'; ctx.fillRect(0,0,canvas.width,canvas.height);
  await page.render({canvasContext:ctx, viewport:vp}).promise;
}

// Vẽ một trang ra ảnh JPEG ~200 dpi (đúng độ phân giải bản quét gốc), trả về base64
async function pageToJpegBase64(doc, pageNum, extra){
  const page = await doc.getPage(pageNum);
  const rot = (((page.rotate + extra) % 360) + 360) % 360;
  const base = page.getViewport({scale:1, rotation:rot});
  let scale = 200/72;
  const maxPx = 5.5e6;                                   // khổ lớn quá thì hạ bớt, tránh tràn bộ nhớ
  if(base.width*base.height*scale*scale > maxPx) scale = Math.sqrt(maxPx/(base.width*base.height));
  const vp = page.getViewport({scale, rotation:rot});
  const canvas = document.createElement('canvas');
  canvas.width = Math.round(vp.width); canvas.height = Math.round(vp.height);
  const ctx = canvas.getContext('2d');
  ctx.fillStyle = '#fff'; ctx.fillRect(0,0,canvas.width,canvas.height);
  await page.render({canvasContext:ctx, viewport:vp}).promise;
  const b64 = canvas.toDataURL('image/jpeg', 0.82).split(',')[1];
  canvas.width = canvas.height = 0;
  page.cleanup();
  return b64;
}

async function openPdfWizard(fileList, maBai, existing){
  const files = Array.from(fileList||[]).filter(f=>/\.pdf$/i.test(f.name) || f.type==='application/pdf');
  if(!files.length){ toast('Hãy chọn file PDF', true); return; }
  if(typeof pdfjsLib === 'undefined'){ toast('Chưa tải được thư viện đọc PDF. Kiểm tra mạng rồi tải lại trang.', true); return; }
  overlay('<h2>Đang đọc PDF…</h2><p class="muted">Chờ vài giây</p>', true);
  const docs = [];
  try{
    for(const f of files){
      const buf = await f.arrayBuffer();
      const doc = await pdfjsLib.getDocument({data:buf}).promise;
      docs.push({name:f.name, doc});
    }
  }catch(e){ closeOverlay(); toast('Không đọc được PDF: '+((e&&e.message)||e), true); return; }
  const total = docs.reduce((s,d)=>s+d.doc.numPages, 0);
  let extra = 0;
  const list = docs.map(d=>`<li>${esc(d.name)} — ${d.doc.numPages} trang</li>`).join('');
  const modeHtml = existing>0 ? `
    <div class="field"><label>Thư mục ảnh đã có ${existing} ảnh:</label>
      <label style="display:block;color:var(--ink)"><input type="radio" name="pvMode" value="append" checked> Thêm tiếp vào các ảnh đã có</label>
      <label style="display:block;color:var(--ink)"><input type="radio" name="pvMode" value="replace"> Xóa ảnh cũ, làm lại từ đầu (ảnh cũ vào thùng rác Drive)</label>
    </div>` : '';
  overlay(`<h2>Tải bài làm lên</h2>
    <ul style="margin:0 0 10px;padding-left:18px;font-size:14px">${list}</ul>
    <p style="font-size:14px;margin:0 0 8px">Tổng <b>${total}</b> trang (mỗi trang một phiếu). Xem phiếu mẫu dưới đây đã đúng chiều chưa:</p>
    <div style="text-align:center;margin-bottom:8px"><canvas id="pvCanvas" style="max-width:100%;border:1px solid var(--line);border-radius:6px"></canvas></div>
    <div style="display:flex;gap:8px;justify-content:center;margin-bottom:10px">
      <button class="btn btn-sm" id="pvL">↺ Xoay trái</button><button class="btn btn-sm" id="pvR">↻ Xoay phải</button></div>
    ${modeHtml}
    <div class="row"><button class="btn" id="pvCancel">Hủy</button><button class="btn btn-primary" id="pvGo">Bắt đầu tải lên</button></div>`, true);
  const cv = $('#pvCanvas');
  const draw = async ()=>{
    $('#pvL').disabled = $('#pvR').disabled = true;
    try{ await renderPreview(cv, docs[0].doc, extra); }catch(e){ toast('Không vẽ được trang xem trước', true); }
    $('#pvL').disabled = $('#pvR').disabled = false;
  };
  await draw();
  $('#pvL').onclick = ()=>{ extra = (extra+270)%360; draw(); };
  $('#pvR').onclick = ()=>{ extra = (extra+90)%360; draw(); };
  $('#pvCancel').onclick = ()=>{ closeOverlay(); docs.forEach(d=>{ try{ d.doc.destroy(); }catch(e){} }); };
  $('#pvGo').onclick = ()=>{
    const mode = (document.querySelector('input[name=pvMode]:checked')||{}).value || 'append';
    startUpload(docs, extra, maBai, existing, mode, total);
  };
}

async function startUpload(docs, extra, maBai, existing, mode, total){
  const state = { cancel:false, done:0, failed:[], onProgress:null, authLost:false, lastError:'' };
  const ctx = { state, total, maBai, docs, extra };
  let base = existing;
  if(mode === 'replace'){
    overlay('<h2>Đang xóa ảnh cũ…</h2><p class="muted">Chờ chút</p>', true);
    try{ await apiCall('clearAnh',{maBai}); base = 0; }
    catch(e){ closeOverlay(); toast(e.message, true); return; }
  }
  const items = []; let n = base;
  docs.forEach(d=>{ for(let p=1; p<=d.doc.numPages; p++){ n++; items.push({doc:d.doc, p, name:'p'+String(n).padStart(4,'0')+'.jpg'}); } });
  uploadStage(ctx, items);
}

async function uploadStage(ctx, items){
  const {state, total, maBai, extra} = ctx;
  overlay(`<h2>Đang tải ảnh lên</h2>
    <div class="bar"><div id="barFill"></div></div>
    <p id="progTxt" style="font-size:14px;margin:0">Chuẩn bị…</p>
    <p class="muted" style="font-size:13px;margin:6px 0 0">Cứ để cửa sổ này mở, đừng đóng tab.</p>
    <div class="row"><button class="btn" id="upStop">Dừng</button></div>`, true);
  $('#upStop').onclick = ()=>{ state.cancel = true; const t=$('#progTxt'); if(t) t.textContent = 'Đang dừng…'; };
  state.onProgress = ()=>{
    const fin = state.done + state.failed.length;
    const f = $('#barFill'), t = $('#progTxt');
    if(f) f.style.width = Math.round(fin*100/total)+'%';
    if(t) t.textContent = 'Đã tải '+state.done+'/'+total+' trang' + (state.failed.length ? ' · lỗi '+state.failed.length : '');
  };
  state.onProgress();
  const renderFn = async it => it._data || await pageToJpegBase64(it.doc, it.p, extra);
  const uploadFn = (it, data) => apiCall('uploadAnh',{maBai, name:it.name, data});
  await runUploadQueue(items, renderFn, uploadFn, state);
  await finishUpload(ctx);
}

async function finishUpload(ctx){
  const {state, total, maBai, docs} = ctx;
  let fin = null;
  try{ fin = await apiCall('finishAnh',{maBai}); }catch(e){}
  const failed = state.failed.length;
  let msg;
  if(state.authLost) msg = 'Phiên đăng nhập đã hết hạn nên dừng giữa chừng. Đăng nhập lại rồi chọn PDF và "Thêm tiếp" cho các trang còn thiếu.';
  else if(state.cancel) msg = 'Đã dừng. Đã tải '+state.done+'/'+total+' trang.';
  else if(failed) msg = 'Xong, nhưng '+failed+' trang bị lỗi'+(state.lastError?(' ('+esc(state.lastError)+')'):'')+'. Bấm "Thử lại" để tải nốt.';
  else msg = 'Đã tải đủ '+state.done+' trang.';
  let note = '';
  if(fin && fin.trangThai === 'Sẵn sàng chấm') note = '<p style="font-size:14px;color:var(--ok)">Bài đã đủ đáp án và ảnh: sẵn sàng chấm.'+(fin.emailSent?' Đã gửi email báo.':'')+'</p>';
  else if(fin && !fin.hasDapAn && !failed && !state.cancel) note = '<p style="font-size:14px" class="muted">Bài chưa có file đáp án: vào "Nhập / sửa đáp án" để sinh file.</p>';
  overlay(`<h2>Kết quả</h2><p style="font-size:14px">${msg}</p>${note}
    <div class="row">${(failed && !state.authLost)?'<button class="btn" id="upRetry">Thử lại</button>':''}<button class="btn btn-primary" id="upDone">Xong</button></div>`, true);
  $('#upDone').onclick = ()=>{ closeOverlay(); docs.forEach(d=>{ try{ d.doc.destroy(); }catch(e){} }); openBai(maBai); };
  const r = $('#upRetry');
  if(r) r.onclick = ()=>{
    const prev = state.failed;
    state.failed = []; state.cancel = false; state.authLost = false;
    uploadStage(ctx, prev.map(f=>Object.assign({}, f.item, {_data:f.data})));
  };
}

/* ---------- Lớp phủ dùng chung ---------- */
function overlay(html, noClose){
  $('#overlayRoot').innerHTML = `<div class="overlay" id="ov"><div class="card modal">${html}</div></div>`;
  if(!noClose) $('#ov').onclick = e=>{ if(e.target.id==='ov') closeOverlay(); };
}
function closeOverlay(){ $('#overlayRoot').innerHTML=''; }

function handleErr(e){
  if(/Phiên đã hết hạn/.test(e.message)){ clearSession(); USER=null; showLogin(); }
  toast(e.message, true);
}
