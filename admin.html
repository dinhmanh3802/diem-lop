<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Quản lý lớp — Vật lý mẹ Cường</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#eef1f4; --surface:#ffffff; --ink:#18212b; --muted:#5d6b78;
    --line:#e2e7ec; --primary:#0b5fff; --primary-dark:#0847c4;
    --ok:#15803d; --warn:#b45309; --danger:#b42318;
    --radius:10px;
    font-family:'Be Vietnam Pro',system-ui,sans-serif;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);font-size:15px;line-height:1.5;
    padding-top:env(safe-area-inset-top,0);padding-bottom:env(safe-area-inset-bottom,0)}
  h1,h2,h3{margin:0;font-weight:600}
  button{font-family:inherit;cursor:pointer}
  input,select{font-family:inherit;font-size:14px}
  .hidden{display:none !important}

  /* Nút */
  .btn{border:1px solid var(--line);background:var(--surface);color:var(--ink);
    padding:8px 14px;border-radius:8px;font-size:14px;font-weight:500}
  .btn:hover{border-color:#c6cfd8}
  .btn-primary{background:var(--primary);border-color:var(--primary);color:#fff}
  .btn-primary:hover{background:var(--primary-dark);border-color:var(--primary-dark)}
  .btn-sm{padding:5px 10px;font-size:13px}
  .btn-ghost{background:transparent;border-color:transparent;color:var(--muted)}
  .btn-ghost:hover{color:var(--ink)}
  .btn-danger{color:var(--danger);border-color:#f0cfcb}
  .link{color:var(--primary);background:none;border:none;padding:0;font-size:14px}

  /* Đăng nhập */
  #loginView{min-height:100dvh;display:grid;place-items:center;padding:20px}
  .card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius)}
  .login-card{width:100%;max-width:360px;padding:28px}
  .login-card h1{font-size:20px;margin-bottom:4px}
  .login-card p.sub{color:var(--muted);font-size:14px;margin:0 0 20px}
  .field{margin-bottom:14px}
  .field label{display:block;font-size:13px;color:var(--muted);margin-bottom:5px}
  .field input{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:8px;outline:none}
  .field input:focus{border-color:var(--primary)}

  /* Khung ứng dụng */
  header.app{position:sticky;top:0;z-index:10;background:var(--surface);border-bottom:1px solid var(--line);
    display:flex;align-items:center;gap:12px;padding:12px 18px;padding-top:calc(12px + env(safe-area-inset-top,0))}
  header.app .title{font-size:16px;font-weight:600}
  header.app .spacer{flex:1}
  header.app .who{font-size:13px;color:var(--muted);text-align:right}
  .wrap{max-width:1000px;margin:0 auto;padding:18px}
  .nav{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:16px}
  .nav .group{display:flex;flex-direction:column;align-items:flex-start;gap:2px;
    padding:8px 12px;border:1px solid var(--line);background:var(--surface);border-radius:8px}
  .nav .group .n{font-weight:600;font-size:14px}
  .nav .group .c{font-size:12px;color:var(--muted)}
  .nav .group.active{border-color:var(--primary);box-shadow:inset 0 0 0 1px var(--primary)}

  .toolbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:12px}
  .toolbar .spacer{flex:1}
  .panel-title{font-size:15px;font-weight:600;margin-bottom:10px}

  table{width:100%;border-collapse:collapse;background:var(--surface);
    border:1px solid var(--line);border-radius:var(--radius);overflow:hidden}
  th,td{text-align:left;padding:8px 10px;border-bottom:1px solid var(--line);font-size:14px;vertical-align:middle}
  th{background:#f6f8fa;font-weight:600;color:var(--muted);font-size:12px}
  tr:last-child td{border-bottom:none}
  td input,td select{width:100%;padding:6px 8px;border:1px solid transparent;border-radius:6px;background:transparent}
  td input:hover,td select:hover{border-color:var(--line)}
  td input:focus,td select:focus{border-color:var(--primary);background:#fff;outline:none}
  td.sbd{font-variant-numeric:tabular-nums;color:var(--muted);white-space:nowrap}
  td.act{white-space:nowrap;text-align:right}
  .pill{font-size:12px;padding:2px 8px;border-radius:999px;white-space:nowrap}
  .pill.nghi{background:#fdeceb;color:var(--danger)}
  .pill.chuyen{background:#fff4e5;color:var(--warn)}
  tr.inactive td.sbd, tr.inactive td input{color:#9aa6b1}

  /* Lớp phủ */
  .overlay{position:fixed;inset:0;background:rgba(20,28,38,.45);display:grid;place-items:center;z-index:50;padding:16px}
  .modal{width:100%;max-width:440px;padding:22px;max-height:85dvh;overflow:auto}
  .modal h2{font-size:17px;margin-bottom:14px}
  .modal.wide{max-width:720px}
  .modal .row{display:flex;gap:8px;justify-content:flex-end;margin-top:18px}

  /* Toast */
  #toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);z-index:100;
    background:#18212b;color:#fff;padding:10px 16px;border-radius:8px;font-size:14px;opacity:0;
    transition:opacity .2s, transform .2s;pointer-events:none;max-width:90vw}
  #toast.show{opacity:1;transform:translateX(-50%) translateY(-4px)}
  #toast.err{background:var(--danger)}

  .notice{background:#fff7e6;border:1px solid #f3d99b;color:#8a5a00;padding:12px 14px;border-radius:8px;margin-bottom:16px;font-size:14px}
  .muted{color:var(--muted)}
  .pill.ok{background:#e8f6ee;color:var(--ok)}
  .pill.wait{background:#fff4e5;color:var(--warn)}
  .hubcard{padding:16px;margin-bottom:12px;max-width:720px}
  .hubcard h3{font-size:15px}
  .hubcard.drag{outline:2px dashed var(--primary);background:#f3f7ff}
  .pvItem{display:flex;gap:12px;align-items:flex-start;padding:8px;border:1px solid var(--line);border-radius:8px;margin-bottom:8px}
  .pvCv{width:96px;height:auto;border:1px solid var(--line);border-radius:4px;flex:none;background:#fff}
  .bar{height:10px;background:#e7ecf1;border-radius:999px;overflow:hidden;margin:8px 0 10px}
  .bar>div{height:100%;background:var(--primary);width:0;transition:width .2s}
  .issue{display:flex;gap:8px;padding:8px 0;border-bottom:1px solid var(--line);font-size:14px}
  .issue:last-child{border-bottom:none}
  .issue .t{font-weight:600;min-width:150px}

  @media(max-width:600px){
    td.lop-col,th.lop-col{display:none}
    .wrap{padding:12px}
  }
</style>
</head>
<body>

<!-- ĐĂNG NHẬP -->
<div id="loginView" class="hidden">
  <div class="card login-card">
    <h1>Quản lý lớp</h1>
    <p class="sub">Vật lý mẹ Cường</p>
    <div id="configWarn" class="notice hidden">Chưa cấu hình URL máy chủ trong <code>config.js</code>.</div>
    <div class="field">
      <label for="u">Tài khoản</label>
      <input id="u" autocomplete="username" autocapitalize="off">
    </div>
    <div class="field">
      <label for="p">Mật khẩu</label>
      <input id="p" type="password" autocomplete="current-password">
    </div>
    <button id="loginBtn" class="btn btn-primary" style="width:100%">Đăng nhập</button>
  </div>
</div>

<!-- ỨNG DỤNG -->
<div id="appView" class="hidden">
  <header class="app">
    <span class="title">Quản lý lớp</span>
    <span class="spacer"></span>
    <span class="who" id="whoami"></span>
    <button class="btn btn-sm" id="pwBtn">Đổi mật khẩu</button>
    <button class="btn btn-sm" id="logoutBtn">Thoát</button>
  </header>
  <div class="wrap">
    <div class="toolbar">
      <button class="btn btn-sm" id="usersBtn">Tài khoản & giáo viên</button>
      <button class="btn btn-sm" id="examsBtn">Bài kiểm tra</button>
      <button class="btn btn-sm" id="syncBtn">Đồng bộ nhóm</button>
      <button class="btn btn-sm" id="validateBtn">Kiểm tra danh sách</button>
      <span class="spacer"></span>
      <button class="btn btn-sm" id="reloadBtn">Tải lại</button>
    </div>

    <!-- Màn nhóm/học sinh -->
    <div id="rosterScreen">
      <div class="nav" id="groupNav"></div>
      <div id="studentsArea"></div>
    </div>

    <!-- Màn tài khoản (admin) -->
    <div id="usersScreen" class="hidden"></div>

    <!-- Màn bài kiểm tra -->
    <div id="examsScreen" class="hidden"></div>
  </div>
</div>

<div id="overlayRoot"></div>
<div id="toast"></div>

<script src="https://cdn.jsdelivr.net/npm/pdfjs-dist@3.11.174/build/pdf.min.js"></script>
<script>if(window.pdfjsLib){pdfjsLib.GlobalWorkerOptions.workerSrc='https://cdn.jsdelivr.net/npm/pdfjs-dist@3.11.174/build/pdf.worker.min.js';}</script>
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<script src="config.js"></script>
<script src="api.js"></script>
<script>
const $ = s => document.querySelector(s);
let GROUPS = [], CUR = null, USER = null;

function toast(msg, isErr){
  const t = $('#toast'); t.textContent = msg; t.className = 'show' + (isErr?' err':'');
  setTimeout(()=>{ t.className = isErr?'err':''; }, isErr?3500:2000);
}
function esc(s){ return String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }

/* ---------- Khởi động ---------- */
function init(){
  if(!window.APP_CONFIG || !window.APP_CONFIG.API_URL || window.APP_CONFIG.API_URL.indexOf('http')!==0){
    $('#loginView').classList.remove('hidden'); $('#configWarn').classList.remove('hidden'); return;
  }
  USER = getUser();
  if(USER && localStorage.getItem('token')) showApp();
  else showLogin();
}
function showLogin(){ $('#appView').classList.add('hidden'); $('#loginView').classList.remove('hidden'); $('#u').focus(); }
async function showApp(){
  $('#loginView').classList.add('hidden'); $('#appView').classList.remove('hidden');
  $('#whoami').textContent = USER.fullName + ' · ' + (USER.role==='admin'?'Quản trị':'Giáo viên');
  $('#usersBtn').classList.toggle('hidden', USER.role!=='admin');
  $('#syncBtn').classList.toggle('hidden', USER.role==='admin');
  openRoster();
  await loadGroups();
}

/* ---------- Đăng nhập ---------- */
$('#loginBtn').onclick = async ()=>{
  const username = $('#u').value.trim(), password = $('#p').value;
  if(!username || !password){ toast('Nhập tài khoản và mật khẩu', true); return; }
  $('#loginBtn').disabled = true;
  try{
    const r = await apiCall('login', {username, password});
    setSession(r.token, r.user); USER = r.user;
    if(r.user.mustChange){ await showApp(); openChangePw(true); }
    else await showApp();
  }catch(e){ toast(e.message, true); }
  finally{ $('#loginBtn').disabled = false; }
};
$('#p').addEventListener('keydown', e=>{ if(e.key==='Enter') $('#loginBtn').click(); });

$('#logoutBtn').onclick = async ()=>{
  try{ await apiCall('logout'); }catch(e){}
  clearSession(); USER=null; GROUPS=[]; CUR=null; showLogin();
};

/* ---------- Nhóm & học sinh ---------- */
function openRoster(){ $('#rosterScreen').classList.remove('hidden'); $('#usersScreen').classList.add('hidden'); $('#examsScreen').classList.add('hidden'); }
$('#reloadBtn').onclick = ()=>{ if($('#usersScreen').classList.contains('hidden')){ loadGroups(); } else { openUsers(); } };

async function loadGroups(){
  $('#groupNav').innerHTML = '<span class="muted">Đang tải nhóm…</span>';
  try{
    const r = await apiCall('listGroups');
    GROUPS = r.groups;
    renderGroupNav();
    if(GROUPS.length){ if(!CUR || !GROUPS.find(g=>g.maNhom===CUR)) CUR = GROUPS[0].maNhom; selectGroup(CUR); }
    else $('#studentsArea').innerHTML = '<p class="muted">Chưa có nhóm nào.</p>';
  }catch(e){ handleErr(e); }
}
function renderGroupNav(){
  $('#groupNav').innerHTML = GROUPS.map(g=>`
    <button class="group ${g.maNhom===CUR?'active':''}" data-m="${g.maNhom}">
      <span class="n">${esc(g.tenNhom)}</span>
      <span class="c">${g.active} đang học · ${g.total} tổng · ${g.maNhom}</span>
    </button>`).join('');
  document.querySelectorAll('#groupNav .group').forEach(b=> b.onclick = ()=>{ CUR=b.dataset.m; renderGroupNav(); selectGroup(CUR); });
}

async function selectGroup(maNhom){
  $('#studentsArea').innerHTML = '<p class="muted">Đang tải học sinh…</p>';
  try{
    const r = await apiCall('listStudents', {maNhom});
    renderStudents(r);
  }catch(e){ handleErr(e); }
}

function renderStudents(data){
  const rows = data.students.map(s=>{
    const inactive = s.trangThai!=='Đang học';
    let pill = '';
    if(s.trangThai==='Đã nghỉ') pill = '<span class="pill nghi">Đã nghỉ</span>';
    else if(s.trangThai==='Đã chuyển') pill = '<span class="pill chuyen">Đã chuyển</span>';
    return `<tr class="${inactive?'inactive':''}" data-sbd="${s.sbd}">
      <td class="sbd">${esc(s.sbd)}${s.sbdCu?'<br><span class="muted" style="font-size:11px">cũ: '+esc(s.sbdCu)+'</span>':''}</td>
      <td><input class="f-ho" value="${esc(s.ho)}"></td>
      <td><input class="f-ten" value="${esc(s.ten)}"></td>
      <td class="lop-col"><input class="f-lop" value="${esc(s.lop)}" style="max-width:70px"></td>
      <td>
        <select class="f-status">
          <option ${s.trangThai==='Đang học'?'selected':''}>Đang học</option>
          <option ${s.trangThai==='Đã nghỉ'?'selected':''}>Đã nghỉ</option>
          ${s.trangThai==='Đã chuyển'?'<option selected>Đã chuyển</option>':''}
        </select>
      </td>
      <td class="act">${pill}
        <button class="btn btn-sm save">Lưu</button>
        <button class="btn btn-sm transfer">Chuyển</button>
      </td>
    </tr>`;
  }).join('');

  $('#studentsArea').innerHTML = `
    <div class="panel-title">${esc(data.tenNhom)} <span class="muted" style="font-weight:400">(${data.students.length} học sinh)</span></div>
    <table>
      <thead><tr><th>SBD</th><th>Họ</th><th>Tên</th><th class="lop-col">Lớp</th><th>Trạng thái</th><th></th></tr></thead>
      <tbody id="stBody">${rows}</tbody>
      <tfoot><tr class="addrow">
        <td class="sbd muted">tự cấp</td>
        <td><input id="new-ho" placeholder="Họ"></td>
        <td><input id="new-ten" placeholder="Tên"></td>
        <td class="lop-col"><input id="new-lop" placeholder="Lớp" style="max-width:70px"></td>
        <td></td>
        <td class="act"><button class="btn btn-sm btn-primary" id="addBtn">Thêm học sinh</button></td>
      </tr></tfoot>
    </table>`;

  document.querySelectorAll('#stBody tr').forEach(tr=>{
    const sbd = tr.dataset.sbd;
    tr.querySelector('.save').onclick = ()=> saveStudent(tr, sbd);
    tr.querySelector('.transfer').onclick = ()=> openTransfer(sbd, tr);
    tr.querySelector('.f-status').onchange = (e)=> changeStatus(sbd, e.target.value);
  });
  $('#addBtn').onclick = addStudent;
}

async function saveStudent(tr, sbd){
  const ho = tr.querySelector('.f-ho').value.trim();
  const ten = tr.querySelector('.f-ten').value.trim();
  const lop = tr.querySelector('.f-lop') ? tr.querySelector('.f-lop').value.trim() : '';
  try{
    await apiCall('upsertStudent', {maNhom:CUR, sbd, ho, ten, lop});
    toast('Đã lưu ' + sbd);
  }catch(e){ handleErr(e); }
}
async function changeStatus(sbd, trangThai){
  try{ await apiCall('setStudentStatus', {maNhom:CUR, sbd, trangThai}); toast('Đã đổi trạng thái'); loadGroups(); selectGroup(CUR); }
  catch(e){ handleErr(e); }
}
async function addStudent(){
  const ho = $('#new-ho').value.trim(), ten = $('#new-ten').value.trim(), lop = ($('#new-lop')||{}).value || '';
  if(!ho && !ten){ toast('Nhập họ tên', true); return; }
  try{
    const r = await apiCall('upsertStudent', {maNhom:CUR, ho, ten, lop:lop.trim()});
    toast('Đã thêm, SBD ' + r.sbd);
    loadGroups(); selectGroup(CUR);
  }catch(e){ handleErr(e); }
}

/* ---------- Chuyển nhóm ---------- */
function openTransfer(sbd){
  const others = GROUPS.filter(g=>g.maNhom!==CUR);
  if(!others.length){ toast('Không có nhóm khác để chuyển', true); return; }
  const opts = others.map(g=>`<option value="${g.maNhom}">${esc(g.tenNhom)} (${g.maNhom})</option>`).join('');
  overlay(`
    <h2>Chuyển nhóm cho ${esc(sbd)}</h2>
    <p class="muted" style="font-size:13px;margin:0 0 12px">Em sẽ được cấp SBD mới ở nhóm đến; SBD cũ được giữ làm lịch sử, dòng cũ chuyển sang "Đã chuyển".</p>
    <div class="field"><label>Chuyển sang nhóm</label><select id="trTo" style="width:100%;padding:10px;border:1px solid var(--line);border-radius:8px">${opts}</select></div>
    <div class="row"><button class="btn" onclick="closeOverlay()">Hủy</button><button class="btn btn-primary" id="trGo">Chuyển</button></div>
  `);
  $('#trGo').onclick = async ()=>{
    const toMaNhom = $('#trTo').value;
    try{ const r = await apiCall('transferStudent', {fromMaNhom:CUR, sbd, toMaNhom}); closeOverlay(); toast('Đã chuyển, SBD mới ' + r.newSbd); loadGroups(); selectGroup(CUR); }
    catch(e){ handleErr(e); }
  };
}

/* ---------- Đồng bộ nhóm ---------- */
$('#syncBtn').onclick = async ()=>{
  try{
    const r = await apiCall('syncGroups');
    showSyncReport(r);
    loadGroups();
  }catch(e){ handleErr(e); }
};
function showSyncReport(r){
  const reg = (r.registered||[]).map(x=>esc(x.maNhom)+' '+esc(x.tenNhom)).join(', ') || '(không có)';
  const con = (r.conflicts||[]).map(x=>`<div class="issue"><span class="t">${esc(x.maNhom)} ${esc(x.tenNhom)}</span><span>${esc(x.lyDo)}</span></div>`).join('');
  overlay(`<h2>Kết quả đồng bộ</h2>
    <p style="font-size:14px"><b>Đã đăng ký:</b> ${reg}</p>
    ${con?('<p style="font-size:14px;margin-top:10px"><b>Bỏ qua (cần xử lý):</b></p>'+con):'<p class="muted" style="font-size:14px">Không có nhóm nào bị bỏ qua.</p>'}
    <div class="row"><button class="btn" onclick="closeOverlay()">Đóng</button></div>`);
}

/* ---------- Kiểm tra danh sách ---------- */
$('#validateBtn').onclick = async ()=>{
  overlay('<h2>Kiểm tra danh sách</h2><p class="muted">Đang kiểm tra…</p>');
  try{
    const r = await apiCall('validateRoster');
    let body;
    if(r.ok) body = '<p style="color:var(--ok)">Không phát hiện vấn đề.</p>';
    else body = r.issues.map(i=>`<div class="issue"><span class="t">${esc(i.type)}</span><span>${esc(i.group)} — ${esc(i.detail)}</span></div>`).join('');
    overlay(`<h2>Kiểm tra danh sách</h2><div>${body}</div><div class="row"><button class="btn" onclick="closeOverlay()">Đóng</button></div>`);
  }catch(e){ closeOverlay(); handleErr(e); }
};

/* ---------- Đổi mật khẩu ---------- */
$('#pwBtn').onclick = ()=> openChangePw(false);
function openChangePw(forced){
  overlay(`
    <h2>Đổi mật khẩu</h2>
    ${forced?'<p class="muted" style="font-size:13px;margin:0 0 12px">Đây là lần đăng nhập đầu, hãy đặt mật khẩu mới.</p>':''}
    <div class="field"><label>Mật khẩu hiện tại</label><input id="oldPw" type="password" style="width:100%;padding:10px;border:1px solid var(--line);border-radius:8px"></div>
    <div class="field"><label>Mật khẩu mới (tối thiểu 6 ký tự)</label><input id="newPw" type="password" style="width:100%;padding:10px;border:1px solid var(--line);border-radius:8px"></div>
    <div class="row">${forced?'':'<button class="btn" onclick="closeOverlay()">Hủy</button>'}<button class="btn btn-primary" id="pwGo">Lưu</button></div>
  `, forced);
  $('#pwGo').onclick = async ()=>{
    const oldPassword = $('#oldPw').value, newPassword = $('#newPw').value;
    try{ await apiCall('changePassword', {oldPassword, newPassword}); closeOverlay(); toast('Đã đổi mật khẩu'); }
    catch(e){ toast(e.message, true); }
  };
}

/* ---------- Tài khoản (admin) ---------- */
$('#usersBtn').onclick = openUsers;
function dai(u){
  if(u.rangeStart===''||u.rangeStart===undefined||u.rangeStart===null) return '—';
  const p3 = n => ('00'+parseInt(n,10)).slice(-3);
  return p3(u.rangeStart)+'–'+p3(u.rangeEnd);
}
async function openUsers(){
  $('#rosterScreen').classList.add('hidden'); $('#examsScreen').classList.add('hidden'); $('#usersScreen').classList.remove('hidden');
  $('#usersScreen').innerHTML = '<p class="muted">Đang tải…</p>';
  try{
    const r = await apiCall('listUsers');
    const rows = r.users.map(u=>{
      const isTeacher = u.role==='teacher';
      return `<tr>
      <td>${esc(u.username)}</td><td>${esc(u.fullName)}</td>
      <td>${u.role==='admin'?'Quản trị':'Giáo viên'}</td>

let EX = { bai:null, cfg:null, ans:{}, curMaDe:null };

$('#examsBtn').onclick = openExams;

function blankCfg(){
  return { p1:{on:true,soCau:18,diem:4.5}, p2:{on:true,soCau:4,d1:0.1,d2:0.25,d3:0.5,d4:1.0}, p3:{on:true,soCau:6,diem:1.5}, maDeList:[] };
}
function cfgTotal(c){
  let t=0;
  if(c.p1.on) t+=Number(c.p1.diem)||0;
  if(c.p2.on) t+=(Number(c.p2.soCau)||0)*(Number(c.p2.d4)||0);
  if(c.p3.on) t+=Number(c.p3.diem)||0;
  return t;
}

async function startConfig(maBai, preloaded){
  // maBai null = tạo mới; nếu có = sửa cấu hình bài cũ
  EX = { bai:null, cfg:blankCfg(), ans:{}, curMaDe:null };
  let groups=[];
  try{ groups = (await apiCall('listGroups')).groups; }catch(e){ handleErr(e); return; }
  if(maBai){
    try{ const b = preloaded || await apiCall('getBai',{maBai}); EX.bai=b; EX.cfg=b.cauHinh; EX.ans=b.dapAn||{}; }catch(e){ handleErr(e); return; }
  }
  renderConfig(groups);
}

function renderConfig(groups){
  const c = EX.cfg;
  const checkedNhom = new Set((EX.bai?EX.bai.cacNhom:[]));
  const nhomBoxes = groups.map(g=>`<label style="display:inline-flex;align-items:center;gap:6px;margin:4px 10px 4px 0">
     <input type="checkbox" class="exNhom" value="${esc(g.maNhom)}" ${checkedNhom.has(g.maNhom)?'checked':''}> ${esc(g.tenNhom)}</label>`).join('');
  function partRow(key,label,fields){ return fields; }
  $('#examsScreen').innerHTML = `
    <div class="toolbar"><button class="btn btn-sm" id="exCancel">← Hủy</button>
      <span class="panel-title" style="margin:0 8px">${EX.bai?'Sửa bài':'Tạo bài mới'}</span></div>
    <div class="card" style="padding:18px;max-width:640px">
      <div class="field"><label>Tên bài</label><input id="cfgTen" value="${EX.bai?esc(EX.bai.tenBai):''}" style="width:100%;padding:10px;border:1px solid var(--line);border-radius:8px"></div>
      <div class="field"><label>Ngày kiểm tra</label><input id="cfgNgay" type="date" value="${EX.bai?esc(EX.bai.ngay):''}" style="padding:10px;border:1px solid var(--line);border-radius:8px"></div>
      <div class="field"><label>Nhóm làm bài</label><div>${nhomBoxes||'<span class="muted">Chưa có nhóm</span>'}</div></div>

      <div class="field" style="border-top:1px solid var(--line);padding-top:12px">
        <label style="display:flex;align-items:center;gap:8px"><input type="checkbox" id="p1on" ${c.p1.on?'checked':''}> <b>Phần I — trắc nghiệm A/B/C/D</b></label>
        <div style="display:flex;gap:8px;margin-top:6px">
          <div style="flex:1"><label>Số câu</label><input id="p1n" type="number" min="0" value="${c.p1.soCau}" style="width:100%;padding:8px;border:1px solid var(--line);border-radius:8px"></div>
          <div style="flex:1"><label>Tổng điểm phần</label><input id="p1d" type="number" step="0.05" value="${c.p1.diem}" style="width:100%;padding:8px;border:1px solid var(--line);border-radius:8px"></div>
        </div>
      </div>

      <div class="field">
        <label style="display:flex;align-items:center;gap:8px"><input type="checkbox" id="p2on" ${c.p2.on?'checked':''}> <b>Phần II — đúng/sai 4 ý</b></label>
        <div style="display:flex;gap:8px;margin-top:6px;flex-wrap:wrap">
          <div style="flex:1;min-width:90px"><label>Số câu</label><input id="p2n" type="number" min="0" value="${c.p2.soCau}" style="width:100%;padding:8px;border:1px solid var(--line);border-radius:8px"></div>
          <div style="flex:1;min-width:70px"><label>Đúng 1 ý</label><input id="p2d1" type="number" step="0.05" value="${c.p2.d1}" style="width:100%;padding:8px;border:1px solid var(--line);border-radius:8px"></div>
          <div style="flex:1;min-width:70px"><label>2 ý</label><input id="p2d2" type="number" step="0.05" value="${c.p2.d2}" style="width:100%;padding:8px;border:1px solid var(--line);border-radius:8px"></div>
          <div style="flex:1;min-width:70px"><label>3 ý</label><input id="p2d3" type="number" step="0.05" value="${c.p2.d3}" style="width:100%;padding:8px;border:1px solid var(--line);border-radius:8px"></div>
          <div style="flex:1;min-width:70px"><label>4 ý</label><input id="p2d4" type="number" step="0.05" value="${c.p2.d4}" style="width:100%;padding:8px;border:1px solid var(--line);border-radius:8px"></div>
        </div>
      </div>

      <div class="field">
        <label style="display:flex;align-items:center;gap:8px"><input type="checkbox" id="p3on" ${c.p3.on?'checked':''}> <b>Phần III — trả lời ngắn (số)</b></label>
        <div style="display:flex;gap:8px;margin-top:6px">
          <div style="flex:1"><label>Số câu</label><input id="p3n" type="number" min="0" value="${c.p3.soCau}" style="width:100%;padding:8px;border:1px solid var(--line);border-radius:8px"></div>
          <div style="flex:1"><label>Tổng điểm phần</label><input id="p3d" type="number" step="0.05" value="${c.p3.diem}" style="width:100%;padding:8px;border:1px solid var(--line);border-radius:8px"></div>
        </div>
      </div>

      <div class="field" style="border-top:1px solid var(--line);padding-top:12px">
        <label>Mã đề (cách nhau bởi dấu phẩy, ví dụ 1,2,3,4 → 001…)</label>
        <input id="cfgMaDe" value="${(EX.cfg.maDeList||[]).join(', ')}" placeholder="1, 2, 3, 4" style="width:100%;padding:10px;border:1px solid var(--line);border-radius:8px">
      </div>

      <div style="display:flex;align-items:center;gap:12px;margin-top:8px">
        <div>Tổng điểm tối đa: <b id="cfgTotal">0</b> / 10</div>
        <span class="spacer" style="flex:1"></span>
        <span class="muted" style="font-size:13px">Đáp án, ảnh phiếu và điểm làm sau ở trang bài, không bắt buộc.</span>
        <button class="btn btn-primary" id="cfgNext">${EX.bai?'Lưu cấu hình':'Tạo bài'}</button>
      </div>
    </div>`;
  $('#exCancel').onclick = openExams;
  const recompute = ()=>{
    EX.cfg = readConfigForm();
    $('#cfgTotal').textContent = cfgTotal(EX.cfg).toFixed(2);
  };
  ['p1on','p1n','p1d','p2on','p2n','p2d1','p2d2','p2d3','p2d4','p3on','p3n','p3d'].forEach(id=> $('#'+id).addEventListener('input', recompute));
  recompute();
  $('#cfgNext').onclick = saveConfig;
}

function readConfigForm(){
  const num = id => Number($('#'+id).value)||0;
  const mad = $('#cfgMaDe').value.split(',').map(s=>s.trim()).filter(Boolean).map(s=>/^\d+$/.test(s)?('00'+parseInt(s,10)).slice(-3):s);
  return {
    p1:{on:$('#p1on').checked, soCau:num('p1n'), diem:num('p1d')},
    p2:{on:$('#p2on').checked, soCau:num('p2n'), d1:num('p2d1'),d2:num('p2d2'),d3:num('p2d3'),d4:num('p2d4')},
    p3:{on:$('#p3on').checked, soCau:num('p3n'), diem:num('p3d')},
    maDeList: mad
  };
}

async function saveConfig(){
  EX.cfg = readConfigForm();
  const cacNhom = Array.from(document.querySelectorAll('.exNhom:checked')).map(x=>x.value);
  const tenBai = $('#cfgTen').value.trim();
  const ngay = $('#cfgNgay').value;
  if(!tenBai){ toast('Nhập tên bài', true); return; }
  if(Math.abs(cfgTotal(EX.cfg)-10)>0.01){ toast('Tổng điểm phải bằng 10', true); return; }
  if(!EX.cfg.maDeList.length){ toast('Nhập ít nhất 1 mã đề', true); return; }
  const btn = $('#cfgNext'), label = btn.textContent;
  btn.disabled = true; btn.textContent = 'Đang lưu…';
  try{
    let maBai;
    if(EX.bai){
      await apiCall('updateBai',{maBai:EX.bai.maBai, tenBai, ngay, cacNhom, cauHinh:EX.cfg});
      maBai = EX.bai.maBai;
    } else {
      const r = await apiCall('createBai',{tenBai, ngay, cacNhom, cauHinh:EX.cfg});
      maBai = r.maBai;
    }
    toast(EX.bai ? 'Đã lưu cấu hình' : 'Đã tạo bài');
    openBai(maBai);               // trang bài: đáp án, ảnh, điểm là 3 việc độc lập, làm việc nào trước cũng được
  }catch(e){ toast(e.message, true); const x = $('#cfgNext'); if(x){ x.disabled = false; x.textContent = label; } }
}

function ensureAns(md){
  if(!EX.ans[md]) EX.ans[md]={p1:[],p2:[],p3:[]};
  if(!EX.ans[md].p1) EX.ans[md].p1=[];
  if(!EX.ans[md].p2) EX.ans[md].p2=[];
  if(!EX.ans[md].p3) EX.ans[md].p3=[];
  return EX.ans[md];
}

function renderAnswers(){
  const c = EX.cfg, md = EX.curMaDe;
  const tabs = c.maDeList.map(x=>`<button class="btn btn-sm ${x===md?'btn-primary':''}" data-md="${esc(x)}">${esc(x)}</button>`).join(' ');
  const a = ensureAns(md);
  let html = '';

  if(c.p1.on){
    let rows='';
    for(let i=0;i<c.p1.soCau;i++){
      const sel=a.p1[i]||'';
      rows += `<div class="arow"><span class="cn">${i+1}</span>${['A','B','C','D'].map(L=>`<button class="seg ${sel===L?'on':''}" data-p="p1" data-i="${i}" data-v="${L}">${L}</button>`).join('')}</div>`;

    html += `<h3 style="margin:14px 0 6px">Phần I</h3><div class="agrid">${rows}</div>`;
  }
  if(c.p2.on){
    let rows='';
    for(let i=0;i<c.p2.soCau;i++){
      const s=(a.p2[i]||'____').padEnd(4,'_').slice(0,4);
      const yrow = [0,1,2,3].map(k=>{
        const v=s[k];
        return `<span class="yrow"><b>${'abcd'[k]}</b>`+
          `<button class="seg ${v==='Đ'?'on':''}" data-p="p2" data-i="${i}" data-k="${k}" data-v="Đ">Đ</button>`+
          `<button class="seg ${v==='S'?'on':''}" data-p="p2" data-i="${i}" data-k="${k}" data-v="S">S</button></span>`;
      }).join('');
      rows += `<div class="arow p2row"><span class="cn">${i+1}</span>${yrow}</div>`;
    }
    html += `<h3 style="margin:14px 0 6px">Phần II</h3><div class="agrid">${rows}</div>`;
  }
  if(c.p3.on){
    let rows='';
    for(let i=0;i<c.p3.soCau;i++){
      rows += `<div class="arow"><span class="cn">${i+1}</span><input class="p3in" data-i="${i}" value="${esc(a.p3[i]||'')}" placeholder="vd 8 hoặc 0,31" style="padding:6px 8px;border:1px solid var(--line);border-radius:6px;max-width:140px"></div>`;
    }
    html += `<h3 style="margin:14px 0 6px">Phần III</h3><div class="agrid">${rows}</div>`;
  }

  $('#examsScreen').innerHTML = `
    <style>
      .agrid{display:flex;flex-wrap:wrap;gap:6px 18px}
      .arow{display:flex;align-items:center;gap:4px}
      .arow .cn{display:inline-block;min-width:26px;color:var(--muted);text-align:right;font-size:13px}
      .seg{border:1px solid var(--line);background:#fff;border-radius:6px;padding:4px 9px;font-size:13px;font-weight:600}
      .seg.on{background:var(--primary);border-color:var(--primary);color:#fff}
      .p2row{width:100%}
      .yrow{display:inline-flex;align-items:center;gap:3px;margin-right:8px}
      .yrow b{font-weight:600;color:var(--muted);margin-right:2px}
    </style>
    <div class="toolbar"><button class="btn btn-sm" id="ansHub">← Trang bài</button><button class="btn btn-sm" id="ansBack">Sửa cấu hình</button>
      <span class="panel-title" style="margin:0 8px">${esc(EX.bai.tenBai)} — nhập đáp án</span></div>
    <div class="toolbar"><span class="muted" style="margin-right:6px">Mã đề:</span>${tabs}
      <span class="spacer"></span>
      <button class="btn btn-sm" id="ansPaste">Dán nhanh mã ${esc(md)}</button></div>
    <div class="card" style="padding:16px">${html}</div>
    <div class="toolbar" style="margin-top:12px">
      <button class="btn btn-primary" id="ansSave">Lưu đáp án</button>
      <button class="btn" id="ansGen">Sinh file đáp án cho TNMaker</button>
      <span class="spacer"></span>
      <span id="ansFileLink"></span>
    </div>`;

  $('#ansBack').onclick = ()=> startConfig(EX.bai.maBai);
  $('#ansHub').onclick = ()=>{ if(confirm('Đáp án chưa bấm Lưu sẽ mất. Quay về trang bài?')) openBai(EX.bai.maBai); };
  document.querySelectorAll('#examsScreen [data-md]').forEach(b=> b.onclick=()=>{ collectVisible(); EX.curMaDe=b.dataset.md; renderAnswers(); });
  document.querySelectorAll('#examsScreen .seg[data-p="p1"]').forEach(b=> b.onclick=()=>{ collectVisible(); const a=ensureAns(md); a.p1[+b.dataset.i]=b.dataset.v; renderAnswers(); });
  document.querySelectorAll('#examsScreen .seg[data-p="p2"]').forEach(b=> b.onclick=()=>{
    collectVisible(); const a=ensureAns(md); let s=(a.p2[+b.dataset.i]||'____').padEnd(4,'_').split('');
    s[+b.dataset.k]=b.dataset.v; a.p2[+b.dataset.i]=s.join(''); renderAnswers();
  });
  $('#ansPaste').onclick = ()=> openPaste(md);
  $('#ansSave').onclick = saveAnswers;
  $('#ansGen').onclick = genFile;
  if(EX.bai.dapAnFile) showFileLink(EX.bai.dapAnFile);

/* >>> UPLOAD-QUEUE */
const sleep = ms => new Promise(r=>setTimeout(r, ms));
async function uploadWithRetry(uploadFn, item, data, state){
  const tries = state.tries || 3;
  const back = state.backoffMs == null ? 800 : state.backoffMs;
  for(let t=0; t<tries; t++){
    if(state.cancel) return false;
    try{ await uploadFn(item, data); return true; }
    catch(e){
      const msg = (e && e.message) || String(e);
      state.lastError = msg;
      if(/Phiên đã hết hạn/.test(msg)){ state.authLost = true; state.cancel = true; return false; }
      if(t === tries-1) return false;
      await sleep(back*(t+1));
    }
  }
  return false;
}
async function runUploadQueue(items, renderFn, uploadFn, state){
  const conc = state.concurrency || 3;
  const prog = ()=>{ try{ if(state.onProgress) state.onProgress(); }catch(e){} };
  const active = new Set();
  for(const item of items){
    if(state.cancel) break;
    while(active.size >= conc) await Promise.race(active);
    if(state.cancel) break;
    let data;
    try{ data = await renderFn(item); }
    catch(e){ state.failed.push({item, data:null}); state.lastError = 'Không vẽ được trang '+item.name; prog(); continue; }
    const pr = uploadWithRetry(uploadFn, item, data, state).then(ok=>{
      if(ok) state.done++; else state.failed.push({item, data});
      active.delete(pr);
      prog();
    });
    active.add(pr);
  }
  await Promise.all(Array.from(active));
}

async function renderPreview(canvas, doc, extra, width){
  const page = await doc.getPage(1);
  const rot = (((page.rotate + extra) % 360) + 360) % 360;
  const base = page.getViewport({scale:1, rotation:rot});
  const vp = page.getViewport({scale:(width||260)/base.width, rotation:rot});
  canvas.width = Math.round(vp.width); canvas.height = Math.round(vp.height);
  const ctx = canvas.getContext('2d');
  ctx.fillStyle = '#fff'; ctx.fillRect(0,0,canvas.width,canvas.height);
  await page.render({canvasContext:ctx, viewport:vp}).promise;
}

// Vẽ một trang ra ảnh JPEG ~200 dpi (đúng độ phân giải bản quét gốc), trả về base64
async function pageToJpegBase64(doc, pageNum, extra){
  const page = await doc.getPage(pageNum);
  const rot = (((page.rotate + extra) % 360) + 360) % 360;
  const base = page.getViewport({scale:1, rotation:rot});
  let scale = 200/72;
  const maxPx = 5.5e6;                                   // khổ lớn quá thì hạ bớt, tránh tràn bộ nhớ
  if(base.width*base.height*scale*scale > maxPx) scale = Math.sqrt(maxPx/(base.width*base.height));
  const vp = page.getViewport({scale, rotation:rot});
  const canvas = document.createElement('canvas');
  canvas.width = Math.round(vp.width); canvas.height = Math.round(vp.height);
  const ctx = canvas.getContext('2d');
  ctx.fillStyle = '#fff'; ctx.fillRect(0,0,canvas.width,canvas.height);
  await page.render({canvasContext:ctx, viewport:vp}).promise;
  const b64 = canvas.toDataURL('image/jpeg', 0.82).split(',')[1];
  canvas.width = canvas.height = 0;
  page.cleanup();
  return b64;
}

async function openPdfWizard(fileList, maBai, existing){
  if(typeof pdfjsLib === 'undefined'){ toast('Chưa tải được thư viện đọc PDF. Kiểm tra mạng rồi tải lại trang.', true); return; }
  const items = [];                 // mỗi file PDF: {name, doc, extra = độ xoay thêm}
  let mode = 'append';
  const addFiles = async list=>{
    const files = Array.from(list||[]).filter(f=>/\.pdf$/i.test(f.name) || f.type==='application/pdf');
    if(!files.length){ toast('Hãy chọn file PDF', true); return; }
    for(const f of files){
      try{
        const doc = await pdfjsLib.getDocument({data: await f.arrayBuffer()}).promise;
        items.push({name:f.name, doc, extra:0});
      }catch(e){ toast('Không đọc được "'+f.name+'": '+((e&&e.message)||e), true); }
    }
  };
  overlay('<h2>Đang đọc PDF…</h2><p class="muted">Chờ vài giây</p>', true, true);
  await addFiles(fileList);
  if(!items.length){ closeOverlay(); return; }

  const drawThumb = async i=>{
    const cv = document.querySelector('.pvCv[data-i="'+i+'"]'); if(!cv || !items[i]) return;
    const btns = document.querySelectorAll('.pvItem[data-i="'+i+'"] .pvL, .pvItem[data-i="'+i+'"] .pvR');
    btns.forEach(x=>x.disabled = true);
    try{ await renderPreview(cv, items[i].doc, items[i].extra, 150); }catch(e){ toast('Không vẽ được trang xem trước', true); }
    btns.forEach(x=>x.disabled = false);
  };
  const render = ()=>{
    const total = items.reduce((sum,d)=>sum+d.doc.numPages, 0);
    const list = items.map((d,i)=>`<div class="pvItem" data-i="${i}">
        <canvas class="pvCv" data-i="${i}"></canvas>
        <div style="flex:1;min-width:0">
          <div style="font-weight:600;font-size:14px;word-break:break-all">${esc(d.name)}</div>
          <div class="muted" style="font-size:13px">${d.doc.numPages} trang · phiếu đầu tiên hiện bên trái</div>
          <div style="margin-top:8px;display:flex;gap:6px;flex-wrap:wrap">
            <button class="btn btn-sm pvL">↺ Xoay trái</button><button class="btn btn-sm pvR">↻ Xoay phải</button><button class="btn btn-sm btn-danger pvX">Bỏ file</button></div>
        </div></div>`).join('');
    const modeHtml = existing>0 ? `
      <div class="field"><label>Thư mục ảnh đã có ${existing} ảnh:</label>
        <label style="display:block;color:var(--ink)"><input type="radio" name="pvMode" value="append"> Thêm tiếp vào các ảnh đã có</label>
        <label style="display:block;color:var(--ink)"><input type="radio" name="pvMode" value="replace"> Xóa ảnh cũ, làm lại từ đầu (ảnh cũ vào thùng rác Drive)</label>
      </div>` : '';
    overlay(`<h2>Tải bài làm lên</h2>
      <p style="font-size:14px;margin:0 0 10px"><b>${items.length}</b> file · <b>${total}</b> trang (mỗi trang một phiếu). Mỗi file xoay riêng được; kiểm tra phiếu đầu của từng file đã đứng thẳng chưa.</p>
      ${list}
      <div style="margin:4px 0 10px"><button class="btn btn-sm" id="pvAdd">+ Thêm file PDF khác</button>
        <span class="muted" style="font-size:12px">(file nằm ở thư mục khác thì thêm ở đây)</span>
        <input type="file" id="pvAddIn" accept="application/pdf,.pdf" multiple class="hidden"></div>
      ${modeHtml}
      <div class="row"><button class="btn" id="pvCancel">Hủy</button><button class="btn btn-primary" id="pvGo">Bắt đầu tải lên (${total} trang)</button></div>`, true, true);
    items.forEach((_,i)=> drawThumb(i));
    document.querySelectorAll('.pvItem').forEach(el=>{
      const i = +el.dataset.i;
      el.querySelector('.pvL').onclick = ()=>{ items[i].extra = (items[i].extra+270)%360; drawThumb(i); };
      el.querySelector('.pvR').onclick = ()=>{ items[i].extra = (items[i].extra+90)%360; drawThumb(i); };
      el.querySelector('.pvX').onclick = ()=>{
        const x = items.splice(i,1)[0]; try{ x.doc.destroy(); }catch(e){}
        if(!items.length) closeOverlay(); else render();
      };
    });
    $('#pvAdd').onclick = ()=> $('#pvAddIn').click();
    $('#pvAddIn').onchange = async e=>{
      const arr = Array.from(e.target.files||[]); e.target.value = '';
      const bt = $('#pvAdd'); bt.disabled = true; bt.textContent = 'Đang đọc…';
      await addFiles(arr); render();
    };
    document.querySelectorAll('input[name=pvMode]').forEach(r=>{ r.checked = (r.value === mode); r.onchange = ()=>{ mode = r.value; }; });
    $('#pvCancel').onclick = ()=>{ closeOverlay(); items.forEach(d=>{ try{ d.doc.destroy(); }catch(e){} }); };
    $('#pvGo').onclick = ()=> startUpload(items, maBai, existing, mode, total);
  };
  render();
}

async function startUpload(docs, maBai, existing, mode, total){
  const state = { cancel:false, done:0, failed:[], onProgress:null, authLost:false, lastError:'' };
  const ctx = { state, total, maBai, docs };
  let base = existing;
  if(mode === 'replace'){
    overlay('<h2>Đang xóa ảnh cũ…</h2><p class="muted">Chờ chút</p>', true);
    try{ await apiCall('clearAnh',{maBai}); base = 0; }
    catch(e){ closeOverlay(); toast(e.message, true); return; }
  }
  const items = []; let n = base;
  docs.forEach(d=>{ for(let p=1; p<=d.doc.numPages; p++){ n++; items.push({doc:d.doc, p, extra:d.extra, name:'p'+String(n).padStart(4,'0')+'.jpg'}); } });
  uploadStage(ctx, items);
}

async function uploadStage(ctx, items){
  const {state, total, maBai} = ctx;
  overlay(`<h2>Đang tải ảnh lên</h2>
    <div class="bar"><div id="barFill"></div></div>
    <p id="progTxt" style="font-size:14px;margin:0">Chuẩn bị…</p>
    <p class="muted" style="font-size:13px;margin:6px 0 0">Cứ để cửa sổ này mở, đừng đóng tab.</p>
    <div class="row"><button class="btn" id="upStop">Dừng</button></div>`, true);
  $('#upStop').onclick = ()=>{ state.cancel = true; const t=$('#progTxt'); if(t) t.textContent = 'Đang dừng…'; };
  state.onProgress = ()=>{
    const fin = state.done + state.failed.length;
    const f = $('#barFill'), t = $('#progTxt');
    if(f) f.style.width = Math.round(fin*100/total)+'%';
    if(t) t.textContent = 'Đã tải '+state.done+'/'+total+' trang' + (state.failed.length ? ' · lỗi '+state.failed.length : '');
  };
  state.onProgress();
  const renderFn = async it => it._data || await pageToJpegBase64(it.doc, it.p, it.extra);
  const uploadFn = (it, data) => apiCall('uploadAnh',{maBai, name:it.name, data});
  await runUploadQueue(items, renderFn, uploadFn, state);
  await finishUpload(ctx);
}

async function finishUpload(ctx){
  const {state, total, maBai, docs} = ctx;
  let fin = null;
  try{ fin = await apiCall('finishAnh',{maBai}); }catch(e){}
  const failed = state.failed.length;
  let msg;
  if(state.authLost) msg = 'Phiên đăng nhập đã hết hạn nên dừng giữa chừng. Đăng nhập lại rồi chọn PDF và "Thêm tiếp" cho các trang còn thiếu.';
  else if(state.cancel) msg = 'Đã dừng. Đã tải '+state.done+'/'+total+' trang.';
  else if(failed) msg = 'Xong, nhưng '+failed+' trang bị lỗi'+(state.lastError?(' ('+esc(state.lastError)+')'):'')+'. Bấm "Thử lại" để tải nốt.';
  else msg = 'Đã tải đủ '+state.done+' trang.';
  let note = '';
  if(fin && fin.trangThai === 'Sẵn sàng chấm') note = '<p style="font-size:14px;color:var(--ok)">Bài đã đủ đáp án và ảnh: sẵn sàng chấm.'+(fin.emailSent?' Đã gửi email báo.':'')+'</p>';
  else if(fin && !fin.hasDapAn && !failed && !state.cancel) note = '<p style="font-size:14px" class="muted">Bài chưa có file đáp án: vào "Nhập / sửa đáp án" để sinh file.</p>';
  overlay(`<h2>Kết quả</h2><p style="font-size:14px">${msg}</p>${note}
    <div class="row">${(failed && !state.authLost)?'<button class="btn" id="upRetry">Thử lại</button>':''}<button class="btn btn-primary" id="upDone">Xong</button></div>`, true);
  $('#upDone').onclick = ()=>{ closeOverlay(); docs.forEach(d=>{ try{ d.doc.destroy(); }catch(e){} }); openBai(maBai); };
  const r = $('#upRetry');
  if(r) r.onclick = ()=>{
    const prev = state.failed;
    state.failed = []; state.cancel = false; state.authLost = false;
    uploadStage(ctx, prev.map(f=>Object.assign({}, f.item, {_data:f.data})));
  };
}

/* >>> PARSE-TNMAKER */
function nfc(s){ return String(s==null?'':s).normalize('NFC'); }
function normSbdClient(v){
  let s = String(v==null?'':v).trim();
  if(/^\d+(\.0+)?$/.test(s)) s = String(parseInt(s,10));
  s = s.replace(/\D/g,'');
  while(s.length && s.length<6) s = '0'+s;
  return s;
}
function normMaDeClient(v){
  const s = String(v==null?'':v).trim();
  return /^\d+(\.0+)?$/.test(s) ? ('00'+parseInt(s,10)).slice(-3) : s;
}
function toNum(v){
  if(typeof v === 'number') return v;
  const t = String(v==null?'':v).trim();
  return t === '' ? NaN : Number(t.replace(',','.'));
}

// Đọc 2 tab của file điểm TNMaker (đã đổi sang mảng 2 chiều). Không phụ thuộc thư viện, chạy được ở trình duyệt và node.
function parseTnmakerAoa(scoreAoa, statAoa){
  const warnings = [];
  const hdr = (scoreAoa[0]||[]).map(x=>nfc(x).trim().toLowerCase());
  const col = name => hdr.indexOf(name);
  const cSbd = col('số báo danh'), cMa = col('mã đề'), cTong = col('tổng điểm');
  const cP1 = col('p1'), cP2 = col('p2'), cP3 = col('p3'), cBai = col('kiểm tra');
  if(cSbd<0 || cMa<0 || cTong<0) throw new Error('Không đúng định dạng file điểm TNMaker (thiếu cột Số báo danh, Mã đề hoặc Tổng điểm).');

  const rows = []; let tenBai = '';
  for(let i=1; i<scoreAoa.length; i++){
    const r = scoreAoa[i];
    if(!r || r[cSbd]==='' || r[cSbd]==null) continue;
    if(!tenBai && cBai>=0) tenBai = nfc(r[cBai]).trim();
    const o = {
      sbd: normSbdClient(r[cSbd]), maDe: normMaDeClient(r[cMa]),
      tong: toNum(r[cTong]), p1: cP1>=0?toNum(r[cP1]):0, p2: cP2>=0?toNum(r[cP2]):0, p3: cP3>=0?toNum(r[cP3]):0, tl: null
    };
    if(!isFinite(o.tong)){ warnings.push('Dòng '+(i+1)+': điểm không phải số, đã bỏ qua (SBD '+o.sbd+')'); continue; }
    ['p1','p2','p3'].forEach(k=>{ if(!isFinite(o[k])) o[k] = 0; });
    rows.push(o);
  }
  if(!rows.length) throw new Error('File không có dòng điểm nào.');

  const keys = {}; let shape = null;
  if(statAoa && statAoa.length > 1){
    const h = (statAoa[0]||[]).map(x=>nfc(x).trim());
    const lo = h.map(x=>x.toLowerCase());
    const cS = lo.indexOf('số báo danh'), cM = lo.indexOf('mã đề'), cC = lo.indexOf('câu');
    if(cS>=0 && cM>=0 && cC>=0){
      // Chia các cột câu hỏi thành 3 phần theo nhãn: 1..n | 1a..nd | 1..m
      const part = []; let cur = 1, seenP2 = false, prevNum = 0;
      for(let c=cC+1; c<h.length; c++){
        const lb = h[c];
        if(/^\d+[a-dA-D]$/.test(lb)){ cur = 2; seenP2 = true; }
        else if(/^\d+$/.test(lb)){
          const n = parseInt(lb,10);
          if(seenP2 || n <= prevNum) cur = 3;
          prevNum = n;
        }
        part[c] = cur;
      }
      const parseRow = row => {
        const a = {p1:[], p2cells:[], p3:[]};
        for(let c=cC+1; c<h.length; c++){
          const v = nfc(row[c]).trim();
          if(part[c]===1) a.p1.push(v.toUpperCase()==='X' ? '' : v.toUpperCase());
          else if(part[c]===2){ const u = v.toUpperCase(); a.p2cells.push(u==='Đ'||u==='S' ? u : '_'); }
          else a.p3.push(v.toUpperCase()==='X' ? '' : v.replace(/_+$/,''));
        }
        const p2 = [];
        for(let i=0; i<a.p2cells.length; i+=4) p2.push(a.p2cells.slice(i,i+4).join('').padEnd(4,'_'));
        return {p1:a.p1, p2, p3:a.p3};
      };
      const recs = [];
      for(let r=1; r<statAoa.length; r++){
        const row = statAoa[r]; if(!row) continue;
        const tag = nfc(row[cC]).trim();
        if(tag === 'Trả lời') recs.push({sbd:normSbdClient(row[cS]), maDe:normMaDeClient(row[cM]), tl:parseRow(row), key:null, used:false});
        else if(tag === 'Đáp án' && recs.length && !recs[recs.length-1].key) recs[recs.length-1].key = parseRow(row);
      }
      if(recs.length){
        shape = {n1: part.filter(x=>x===1).length, n2: part.filter(x=>x===2).length/4, n3: part.filter(x=>x===3).length};
        let khongDong = 0;
        const keyBad = {};
        rows.forEach(row=>{
          const rec = recs.find(x=>!x.used && x.sbd===row.sbd && x.maDe===row.maDe);
          if(!rec){ khongDong++; return; }
          rec.used = true; row.tl = rec.tl;
          if(rec.key){
            const k = JSON.stringify(rec.key);
            if(!keys[row.maDe]) keys[row.maDe] = rec.key;
            else if(JSON.stringify(keys[row.maDe]) !== k) keyBad[row.maDe] = true;
          }
        });
        if(khongDong) warnings.push(khongDong+' dòng điểm không có chi tiết câu trả lời trong tab Thống kê.');
        Object.keys(keyBad).forEach(m=> warnings.push('Đáp án của mã đề '+m+' không đồng nhất giữa các học sinh trong file.'));
        const thua = recs.filter(x=>!x.used).length;
        if(thua) warnings.push(thua+' dòng trong tab Thống kê không có trong Bảng điểm tổng (bỏ qua).');
      }
    }
  }
  if(!shape) warnings.push('File không có tab Thống kê hợp lệ: vẫn nhập được điểm, nhưng sẽ không xem được câu sai.');
  return {tenBai, rows, keys, shape, warnings};
}

function fmtNum(n){ return Math.round(Number(n)*100)/100; }
function spaceSbd(s){ s = String(s||''); return s.slice(0,3)+' '+s.slice(3); }
function safeSheetName(name, used){
  const base = String(name||'Nhóm').replace(/[\\\/\?\*\[\]:]/g,' ').replace(/\s+/g,' ').trim().slice(0,28) || 'Nhóm';
  let n = base, k = 2;
  while(used[n.toLowerCase()]){ n = base+' '+k; k++; }
  used[n.toLowerCase()] = 1;
  return n;
}
// Bảng điểm giống mẫu mẹ đang dùng: mỗi nhóm một tab, dòng 1 là tiêu đề nhóm, dòng 2 là tên cột.
function buildExportWorkbook(X, data){
  const wb = X.utils.book_new(), used = {};
  data.groups.forEach(g=>{
    const list = g.students;
    if(!list.length) return;
    const aoa = [];
    aoa.push(['NHÓM '+g.tenNhom+' – SỐ BÁO DANH '+spaceSbd(list[0].sbd)+'- '+spaceSbd(list[list.length-1].sbd)]);
    aoa.push(['STT','HỌ','TÊN','SBD','LỚP','MÃ ĐỀ','ĐIỂM','P1','P2','P3','GHI CHÚ']);
    list.forEach((s,i)=>{
      const k = s.kq;
      aoa.push([i+1, s.ho||'', s.ten||'', s.sbd, s.lop||'', k?k.maDe:'', k?fmtNum(k.tong):'', k?fmtNum(k.p1):'', k?fmtNum(k.p2):'', k?fmtNum(k.p3):'', k?(k.daSua?'Đã sửa':''):'Vắng']);
    });
    const ws = X.utils.aoa_to_sheet(aoa);
    ws['!merges'] = [{s:{r:0,c:0}, e:{r:0,c:10}}];
    ws['!cols'] = [{wch:5},{wch:18},{wch:10},{wch:9},{wch:7},{wch:7},{wch:7},{wch:6},{wch:6},{wch:6},{wch:10}];
    X.utils.book_append_sheet(wb, ws, safeSheetName(g.tenNhom, used));
  });
  if(data.orphan && data.orphan.length){
    const aoa = [['SBD','MÃ ĐỀ','ĐIỂM','P1','P2','P3','GHI CHÚ']];
    data.orphan.forEach(o=> aoa.push([o.sbd, o.kq.maDe, fmtNum(o.kq.tong), fmtNum(o.kq.p1), fmtNum(o.kq.p2), fmtNum(o.kq.p3), o.kq.daSua?'Đã sửa':'Không còn trong danh sách']));
    X.utils.book_append_sheet(wb, X.utils.aoa_to_sheet(aoa), safeSheetName('Khác', used));
  }
  if(!wb.SheetNames.length) throw new Error('Chưa có dữ liệu để xuất');
  return wb;
}

function displayStatus(s){ return ['Nháp','Chờ chấm','Sẵn sàng chấm'].includes(s) ? 'Chưa có điểm' : s; }
const deepCopy = o => JSON.parse(JSON.stringify(o));

async function openScoreImport(file, b){
  if(typeof XLSX === 'undefined'){ toast('Chưa tải được thư viện Excel. Kiểm tra mạng rồi tải lại trang.', true); return; }
  overlay('<h2>Đang đọc file…</h2><p class="muted">Chờ vài giây</p>', true);
  let parsed;
  try{
    const wb = XLSX.read(await file.arrayBuffer(), {type:'array'});
    const find = (...names)=> wb.SheetNames.find(n=> names.includes(nfc(n).trim().toLowerCase()));
    const sN = find('bảng điểm tổng') || wb.SheetNames[0];
    const tN = find('thống kê');
    const aoa = n => XLSX.utils.sheet_to_json(wb.Sheets[n], {header:1, raw:true, defval:''});
    parsed = parseTnmakerAoa(aoa(sN), tN ? aoa(tN) : null);
  }catch(e){ closeOverlay(); toast('Không đọc được file: '+((e&&e.message)||e), true); return; }
  overlay('<h2>Đang đối chiếu với danh sách lớp…</h2><p class="muted">Chờ vài giây</p>', true);
  try{
    const pv = await apiCall('previewDiem', {maBai:b.maBai, rows:parsed.rows, keys:parsed.keys, shape:parsed.shape});
    closeOverlay();
    EX.imp = {b, file:file.name, parsed, pv, dec:{}};
    initDecisions(EX.imp);
    renderReconcile();
  }catch(e){ closeOverlay(); handleErr(e); }
}

// Lựa chọn mặc định an toàn cho từng dòng có vấn đề
function initDecisions(imp){
  const first = {};
  imp.pv.rows.forEach(r=>{
    const codes = r.issues.map(x=>x.code);
    let d = {a:'keep'};
    if(codes.includes('KHONG_CO_SBD') || codes.includes('TRUNG_DS')) d = {a:'skip'};
    else if(codes.includes('DA_SUA_TAY')) d = {a:'skip'};
    else if(codes.includes('DA_CHUYEN') && r.goiY) d = {a:'assign', to:r.goiY};
    if(codes.includes('TRUNG_FILE')){
      if(first[r.sbd] !== undefined) d = {a:'skip'}; else first[r.sbd] = r.i;
    }
    imp.dec[r.i] = d;
  });
}
function decValue(d){ return d.a==='assign' ? 'assign:'+d.to : d.a; }
function parseDec(v){ return v.indexOf('assign:')===0 ? {a:'assign', to:v.slice(7)} : {a:v}; }

function decOptions(r){
  const pv = EX.imp.pv, codes = r.issues.map(x=>x.code), opts = [];
  const sua = codes.includes('DA_SUA_TAY');
  if(!codes.includes('KHONG_CO_SBD') && !codes.includes('TRUNG_DS')) opts.push(['keep', sua ? 'Ghi đè bằng điểm trong file' : 'Ghi như trong file']);
  opts.push(['skip', sua ? 'Giữ bản đã sửa tay' : 'Bỏ qua dòng này']);
  const pfx = r.sbd.slice(0,3);
  const cand = pv.absent.filter(a=>a.sbd.slice(0,3)===pfx);
  if(r.goiY && !cand.find(a=>a.sbd===r.goiY)) opts.push(['assign:'+r.goiY, 'Gán sang SBD mới '+r.goiY]);
  cand.forEach(a=> opts.push(['assign:'+a.sbd, 'Gán cho '+a.sbd+' · '+((a.ho||'')+' '+(a.ten||'')).trim()]));
  return opts;
}

function finalRows(){
  const imp = EX.imp, out = [];
  imp.pv.rows.forEach(r=>{
    const d = imp.dec[r.i] || {a:'keep'};
    if(d.a === 'skip') return;
    out.push(Object.assign({}, imp.parsed.rows[r.i], {sbd: d.a==='assign' ? d.to : r.sbd}));
  });
  return out;
}
function dupSbd(rows){ const seen = {}, dup = []; rows.forEach(r=>{ if(seen[r.sbd]) dup.push(r.sbd); seen[r.sbd] = 1; }); return Array.from(new Set(dup)); }

function renderReconcile(){
  const imp = EX.imp, pv = imp.pv, p = imp.parsed;
  const bad = pv.rows.filter(r=>r.issues.length);
  const maDes = Array.from(new Set(pv.rows.map(r=>r.maDe))).sort().join(', ');
  const dc = pv.doiChieu;
  const warns = [];
  (p.warnings||[]).forEach(w=> warns.push(esc(w)));
  if(pv.shapeWarn) warns.push(esc(pv.shapeWarn));
  pv.keyConflicts.forEach(k=> warns.push('Mã đề '+esc(k.maDe)+': đáp án trên web khác đáp án trong file ở '+k.soCau+' câu ('+k.chiTiet.map(x=>esc(x)).join('; ')+'). Web sẽ lấy đáp án trong file TNMaker, vì điểm đã chấm theo nó.'));
  if(p.tenBai && nfc(p.tenBai).trim() !== nfc(imp.b.tenBai).trim()) warns.push('Tên bài trong file là "'+esc(p.tenBai)+'", khác tên bài trên web "'+esc(imp.b.tenBai)+'". Kiểm tra xem có chọn nhầm file không.');
  const rows = bad.map(r=>{
    const msgs = r.issues.map(x=>`<div style="color:${x.level==='error'?'var(--danger)':'var(--warn)'}">${esc(x.msg)}</div>`).join('');
    const name = r.ho||r.ten ? esc(((r.ho||'')+' '+(r.ten||'')).trim()) : '<span class="muted">không rõ</span>';
    const cur = decValue(imp.dec[r.i]);
    const opts = decOptions(r).map(o=>`<option value="${esc(o[0])}" ${o[0]===cur?'selected':''}>${esc(o[1])}</option>`).join('');
    return `<tr><td class="sbd">${esc(r.sbd)}<br>${name}</td><td>${esc(r.maDe)}</td><td class="num">${fmtNum(r.tong)}</td><td style="font-size:13px">${msgs}</td>
      <td><select class="impDec" data-i="${r.i}" style="width:100%;padding:6px;border:1px solid var(--line);border-radius:6px">${opts}</select></td></tr>`;
  }).join('');
  const absentHtml = pv.absent.length ? `<details style="margin:10px 0"><summary style="cursor:pointer">Có tên trong danh sách nhưng không có điểm trong file (${pv.absent.length} em)</summary>
      <div style="font-size:14px;padding:6px 0">${pv.absent.map(a=>esc(a.sbd)+' · '+esc(((a.ho||'')+' '+(a.ten||'')).trim())).join('<br>')}</div>
      <div class="muted" style="font-size:13px">Các em này sẽ hiện là "Vắng". Có thể nhập tay điểm sau ở màn kết quả.</div></details>` : '';
  const modeHtml = pv.existing.count ? `<div class="card" style="padding:12px;margin:10px 0">
      <div style="font-size:14px;margin-bottom:6px">Bài này đã có <b>${pv.existing.count}</b> kết quả${pv.existing.edited.length?' (trong đó '+pv.existing.edited.length+' bản đã sửa tay)':''}.</div>
      <label style="display:block;font-size:14px"><input type="radio" name="impMode" value="merge" checked> Cập nhật các em có trong file, giữ nguyên các em khác</label>
      <label style="display:block;font-size:14px"><input type="radio" name="impMode" value="replace"> Xóa hết kết quả cũ của bài rồi nhập lại từ file${pv.existing.edited.length?' (mất cả bản sửa tay)':''}</label></div>` : '';
  $('#examsScreen').innerHTML = `
    <div class="toolbar"><button class="btn btn-sm" id="impCancel">← Hủy, về trang bài</button><span class="panel-title" style="margin:0 8px">Nhập điểm: ${esc(imp.b.tenBai)}</span></div>
    <div class="card" style="padding:16px;max-width:900px">
      <p style="margin:0 0 6px;font-size:14px">File <b>${esc(imp.file)}</b>: đọc được <b>${pv.rows.length}</b> dòng điểm (mã đề ${esc(maDes)}). Khớp danh sách, không có vấn đề: <b>${pv.rows.length-bad.length}</b>. Cần xem: <b style="color:${bad.length?'var(--warn)':'var(--ok)'}">${bad.length}</b>.</p>
      ${(dc.khop+dc.lech)? `<p style="margin:0 0 6px;font-size:14px">Web chấm lại từ câu trả lời trong file: <b>${dc.khop}/${dc.khop+dc.lech}</b> khớp điểm TNMaker${dc.lech?', <b style="color:var(--warn)">'+dc.lech+' lệch</b>':''}.</p>` : ''}
      ${warns.length ? '<div class="notice">'+warns.map(w=>'<div>• '+w+'</div>').join('')+'</div>' : ''}
      ${bad.length ? `<div style="overflow:auto"><table><thead><tr><th>SBD · Họ tên</th><th>Mã đề</th><th>Điểm</th><th>Vấn đề</th><th style="min-width:200px">Cách xử lý</th></tr></thead><tbody>${rows}</tbody></table></div>` : '<p style="color:var(--ok);font-size:14px">Không có dòng nào cần xử lý.</p>'}
      ${absentHtml}${modeHtml}
      <div class="toolbar" style="margin-top:12px"><button class="btn btn-primary" id="impGo">Ghi điểm</button><span class="muted" id="impCount"></span></div>
    </div>`;
  const upd = ()=>{ const n = finalRows().length; $('#impCount').textContent = 'Sẽ ghi '+n+' / '+pv.rows.length+' dòng'; };
  document.querySelectorAll('.impDec').forEach(s=> s.onchange = ()=>{ imp.dec[+s.dataset.i] = parseDec(s.value); upd(); });
  $('#impCancel').onclick = ()=>{ EX.imp = null; openBai(imp.b.maBai); };
  $('#impGo').onclick = doCommit;
  upd();
}

async function doCommit(){
  const imp = EX.imp, rows = finalRows();
  const dup = dupSbd(rows);
  if(dup.length){ toast('SBD '+dup.join(', ')+' bị trùng sau khi xử lý. Hãy chọn "Bỏ qua" cho một trong các dòng.', true); return; }
  const mode = (document.querySelector('input[name=impMode]:checked')||{}).value || 'merge';
  if(!rows.length && mode !== 'replace'){ toast('Không có dòng nào để ghi', true); return; }
  if(mode === 'replace' && !confirm('Xóa hết kết quả cũ của bài (kể cả bản sửa tay) rồi ghi lại từ file?')) return;
  const g = $('#impGo'); g.disabled = true; g.textContent = 'Đang ghi…';
  try{
    const r = await apiCall('commitDiem', {maBai:imp.b.maBai, rows, keys:imp.parsed.keys, mode, tenFile:imp.file});
    toast('Đã ghi '+r.soDong+' kết quả');
    EX.imp = null;
    openResults(imp.b.maBai);
  }catch(e){ toast(e.message, true); const x = $('#impGo'); if(x){ x.disabled = false; x.textContent = 'Ghi điểm'; } }
}

      <button class="btn btn-sm" id="resHist">Lịch sử sửa</button>
      <button class="btn btn-sm" id="resRe">Nhập lại file điểm</button>
      <button class="btn btn-sm" id="resXls">Xuất Excel</button>
      <button class="btn btn-sm ${pub?'':'btn-primary'}" id="resPub">${pub?'Ẩn điểm':'Công bố điểm'}</button></div>
    <div class="panel-title">${esc(b.tenBai)} <span class="muted" style="font-weight:400">· ${esc(b.ngay||'')}</span> <span class="pill ${pub?'ok':'wait'}">${pub?'Đã công bố':'Chưa công bố'}</span></div>
    <div class="nav">${nav}</div>
    <div style="overflow:auto"><table><thead><tr><th>#</th><th>Họ</th><th>Tên</th><th>SBD</th><th>Mã đề</th><th>Điểm</th><th>P1</th><th>P2</th><th>P3</th><th></th></tr></thead><tbody>${rows||'<tr><td colspan="10" class="muted">Không có học sinh.</td></tr>'}</tbody></table></div>`;
  document.querySelectorAll('#examsScreen .nav .group').forEach(x=> x.onclick = ()=>{ EX.res.tab = x.dataset.t; renderResults(); });
  document.querySelectorAll('#examsScreen [data-edit]').forEach(x=> x.onclick = ()=>{
    const sbd = x.closest('tr').dataset.sbd; const s = list.find(y=>y.sbd===sbd); if(s) openEditor(s);
  });
  $('#resBack').onclick = ()=> openBai(b.maBai);
  $('#resHist').onclick = ()=> openHistory(b.maBai);
  $('#resRe').onclick = ()=> openBai(b.maBai);
  $('#resXls').onclick = exportExcel;
  $('#resPub').onclick = togglePublish;
}

async function togglePublish(){
  const b = EX.res.data.bai, pub = b.trangThai === 'Đã công bố';
  if(!pub && !confirm('Công bố điểm bài "'+b.tenBai+'"?\nẢnh phiếu của bài sẽ tự xóa sau 30 ngày kể từ hôm nay. (Trang tra điểm cho học sinh làm ở bước sau.)')) return;
  try{
    const r = await apiCall('setCongBo', {maBai:b.maBai, congBo:!pub});
    b.trangThai = r.trangThai;
    toast(!pub ? 'Đã công bố' : 'Đã ẩn điểm');
    renderResults();
  }catch(e){ handleErr(e); }
}

function exportExcel(){
  if(typeof XLSX === 'undefined'){ toast('Chưa tải được thư viện Excel. Kiểm tra mạng rồi tải lại trang.', true); return; }
  try{
    const wb = buildExportWorkbook(XLSX, EX.res.data);
    const nm = String(EX.res.data.bai.tenBai||'bai').replace(/[\\\/:*?"<>|]/g,'-').trim();
    XLSX.writeFile(wb, 'diem - '+nm+'.xlsx');
  }catch(e){ toast((e&&e.message)||String(e), true); }
}

async function openHistory(maBai){
  overlay('<h2>Lịch sử sửa</h2><p class="muted">Đang tải…</p>', false, true);
  try{
    const r = await apiCall('getNhatKy', {maBai});
    const rows = r.nhatKy.map(x=>`<tr><td class="muted" style="white-space:nowrap">${esc(x.thoiGian)}</td><td>${esc(x.nguoiSua)}</td><td>${esc(x.sbd)}</td><td>${esc(x.truong)}</td><td>${esc(x.cu)} → ${esc(x.moi)}</td><td>${esc(x.lyDo)}</td></tr>`).join('')
      || '<tr><td colspan="6" class="muted">Chưa có thay đổi nào.</td></tr>';
    overlay(`<h2>Lịch sử sửa</h2><div style="overflow:auto"><table><thead><tr><th>Lúc</th><th>Người</th><th>SBD</th><th>Mục</th><th>Thay đổi</th><th>Lý do</th></tr></thead><tbody>${rows}</tbody></table></div>
      <div class="row"><button class="btn" onclick="closeOverlay()">Đóng</button></div>`, false, true);
  }catch(e){ closeOverlay(); handleErr(e); }
}

/* ---------- Sửa điểm một em ---------- */
function openEditor(stu){
  const data = EX.res.data, cfg = data.bai.cauHinh, kq = stu.kq;
  const blank = {p1:[], p2:[], p3:[]};
  const tl = deepCopy(kq && kq.tl ? kq.tl : blank);
  EX.ed = {
    sbd: stu.sbd, name: ((stu.ho||'')+' '+(stu.ten||'')).trim(), hasKq: !!kq,
    maDe0: kq ? kq.maDe : '', maDe: kq ? kq.maDe : ((cfg.maDeList||[])[0]||''),
    tl0: deepCopy(tl), tl,
    d0: kq ? {tong:kq.tong, p1:kq.p1, p2:kq.p2, p3:kq.p3} : null,
    d: kq ? {tong:kq.tong, p1:kq.p1, p2:kq.p2, p3:kq.p3} : {tong:'', p1:'', p2:'', p3:''},
    why: ''
  };
  renderEditor();
}
function readEditorInputs(){
  const ed = EX.ed; if(!$('#edWhy')) return;
  ed.maDe = $('#edMa').value;
  document.querySelectorAll('.edP1').forEach(s=>{ ed.tl.p1[+s.dataset.i] = s.value; });
  const p2 = {};
  document.querySelectorAll('.edP2').forEach(s=>{ const i = +s.dataset.i, k = +s.dataset.k; (p2[i] = p2[i] || ['_','_','_','_'])[k] = s.value || '_'; });
  Object.keys(p2).forEach(i=>{ ed.tl.p2[+i] = p2[i].join(''); });
  document.querySelectorAll('.edP3').forEach(s=>{ ed.tl.p3[+s.dataset.i] = s.value.trim(); });
  ['tong','p1','p2','p3'].forEach(f=>{ const el = $('#edD_'+f); if(el) ed.d[f] = el.value; });
  ed.why = $('#edWhy').value;
}
function renderEditor(){
  const ed = EX.ed, data = EX.res.data, cfg = data.bai.cauHinh;
  const key = (data.keys||{})[ed.maDe];
  const maOpts = (cfg.maDeList||[]).concat(ed.maDe0 && !(cfg.maDeList||[]).includes(ed.maDe0) ? [ed.maDe0] : [])
    .map(m=>`<option ${m===ed.maDe?'selected':''}>${esc(m)}</option>`).join('');
  let ans = '';
  if(!key) ans = '<p class="muted" style="font-size:13px">Mã đề này chưa có đáp án trên hệ thống nên không tính lại được từ câu trả lời. Hãy sửa thẳng điểm ở phần bên dưới.</p>';
  else {
    if(cfg.p1 && cfg.p1.on){
      let h = '';
      for(let i=0; i<cfg.p1.soCau; i++){
        const a = ed.tl.p1[i] || '', k = (key.p1||[])[i] || '';
        h += `<span class="ei"><b>${i+1}</b><select class="edP1 ${a&&a!==k?'sai':''}" data-i="${i}">${['','A','B','C','D'].map(o=>`<option value="${o}" ${o===a?'selected':''}>${o||'—'}</option>`).join('')}</select><i class="ck">${esc(k)}</i></span>`;
      }
      ans += `<div style="margin:8px 0 4px;font-weight:600;font-size:13px">Phần I <span class="muted" style="font-weight:400">(chữ nghiêng nhỏ là đáp án đúng)</span></div><div class="edgrid">${h}</div>`;
    }
    if(cfg.p2 && cfg.p2.on){
      let h = '';
      for(let i=0; i<cfg.p2.soCau; i++){
        const a = (ed.tl.p2[i]||'____').padEnd(4,'_'), k = (key.p2||[])[i] || '';
        h += `<div class="ei2"><b style="min-width:42px">Câu ${i+1}</b>${[0,1,2,3].map(j=>{ const v = a[j]==='_' ? '' : a[j]; return `<span class="ei">${'abcd'[j]}<select class="edP2 ${v&&v!==(k[j]||'')?'sai':''}" data-i="${i}" data-k="${j}">${['','Đ','S'].map(o=>`<option value="${o}" ${o===v?'selected':''}>${o||'—'}</option>`).join('')}</select></span>`; }).join('')}<i class="ck">${esc(k)}</i></div>`;
      }
      ans += `<div style="margin:10px 0 4px;font-weight:600;font-size:13px">Phần II</div>${h}`;
    }
    if(cfg.p3 && cfg.p3.on){
      let h = '';
      for(let i=0; i<cfg.p3.soCau; i++){
        const a = ed.tl.p3[i] || '', k = (key.p3||[])[i] || '';
        h += `<span class="ei"><b>${i+1}</b><input class="edP3 ${a&&a!==k?'sai':''}" data-i="${i}" value="${esc(a)}" style="width:62px"><i class="ck">${esc(k)}</i></span>`;
      }
      ans += `<div style="margin:10px 0 4px;font-weight:600;font-size:13px">Phần III <span class="muted" style="font-weight:400">(so khớp từng ký tự, ví dụ 8,5 khác 8,50)</span></div><div class="edgrid">${h}</div>`;
    }
  }
  const dIn = (f,l)=>`<div style="flex:1;min-width:70px"><label style="font-size:12px;color:var(--muted)">${l}</label><input id="edD_${f}" type="number" step="0.05" min="0" max="10" value="${esc(ed.d[f])}" style="width:100%;padding:7px;border:1px solid var(--line);border-radius:6px"></div>`;
  overlay(`<h2>${ed.hasKq?'Sửa kết quả':'Nhập tay'}: ${esc(ed.name||'(không rõ tên)')} · ${esc(ed.sbd)}</h2>
    <div class="field"><label>Mã đề</label><select id="edMa" style="padding:8px;border:1px solid var(--line);border-radius:6px">${maOpts}</select></div>
    ${ans}
    <details style="margin:12px 0"><summary style="cursor:pointer;font-size:14px">Hoặc sửa thẳng điểm (không tính lại từ câu trả lời)</summary>
      <div style="display:flex;gap:8px;margin-top:8px">${dIn('tong','Tổng')}${dIn('p1','P1')}${dIn('p2','P2')}${dIn('p3','P3')}</div>
      <div class="muted" style="font-size:12px;margin-top:4px">Chỉ điền ô nào cần đổi. Nếu chỉ điền P1/P2/P3, tổng tự cộng lại.</div></details>
    <div class="field"><label>Lý do sửa (bắt buộc, được lưu vào lịch sử)</label><input id="edWhy" value="${esc(ed.why)}" style="width:100%;padding:10px;border:1px solid var(--line);border-radius:8px"></div>
    <div class="row">${ed.hasKq?'<button class="btn btn-danger" id="edDel" style="margin-right:auto">Xóa kết quả</button>':''}<button class="btn" onclick="closeOverlay()">Hủy</button><button class="btn btn-primary" id="edSave">Lưu</button></div>`, true, true);
  $('#edMa').onchange = ()=>{ readEditorInputs(); renderEditor(); };
  $('#edSave').onclick = saveEditor;
  if($('#edDel')) $('#edDel').onclick = deleteEditor;
}
function findStudent(sbd){
  const data = EX.res.data;
  for(const g of data.groups){ const s = g.students.find(x=>x.sbd===sbd); if(s) return s; }
  const o = data.orphan.find(x=>x.sbd===sbd); return o || null;
}
async function saveEditor(){
  readEditorInputs();
  const ed = EX.ed, data = EX.res.data;
  const why = (ed.why||'').trim();
  if(!why){ toast('Nhập lý do sửa', true); return; }
  const anyAns = ed.tl.p1.some(x=>x) || ed.tl.p2.some(x=>/[ĐS]/.test(x)) || ed.tl.p3.some(x=>x);
  const ansChanged = ed.maDe !== ed.maDe0 || JSON.stringify(ed.tl) !== JSON.stringify(ed.tl0);
  const dChanged = ['tong','p1','p2','p3'].some(f=> String(ed.d[f]) !== String(ed.d0 ? ed.d0[f] : ''));
  const payload = {maBai:data.bai.maBai, sbd:ed.sbd, lyDo:why};
  if(ansChanged && anyAns){ payload.maDe = ed.maDe; payload.traLoi = ed.tl; }
  else if(dChanged){ payload.maDe = ed.maDe0 || ed.maDe; ['tong','p1','p2','p3'].forEach(f=>{ if(String(ed.d[f]) !== '') payload[f] = ed.d[f]; }); }
  else { toast('Chưa thay đổi gì', true); return; }
  const btn = $('#edSave'); btn.disabled = true; btn.textContent = 'Đang lưu…';
  try{
    const r = await apiCall('editKetQua', payload);
    const s = findStudent(ed.sbd); if(s) s.kq = r.kq;
    closeOverlay(); toast('Đã lưu: '+fmtNum(r.kq.tong)+' điểm'); renderResults();
  }catch(e){ toast(e.message, true); const x = $('#edSave'); if(x){ x.disabled = false; x.textContent = 'Lưu'; } }
}
async function deleteEditor(){
  readEditorInputs();
  const ed = EX.ed, why = (ed.why||'').trim();
  if(!why){ toast('Nhập lý do xóa', true); return; }
  if(!confirm('Xóa kết quả của '+(ed.name||ed.sbd)+'? Em này sẽ hiện là Vắng.')) return;
  try{
    await apiCall('xoaKetQua', {maBai:EX.res.data.bai.maBai, sbd:ed.sbd, lyDo:why});
    const data = EX.res.data, s = findStudent(ed.sbd);
    if(s && Object.prototype.hasOwnProperty.call(s, 'ho')) s.kq = null;       // học sinh trong danh sách: thành Vắng
    else data.orphan = data.orphan.filter(x=>x.sbd !== ed.sbd);                // kết quả mồ côi: bỏ khỏi danh sách
    closeOverlay(); toast('Đã xóa'); renderResults();
  }catch(e){ toast(e.message, true); }
}

/* ---------- Lớp phủ dùng chung ---------- */
function overlay(html, noClose, wide){
  $('#overlayRoot').innerHTML = `<div class="overlay" id="ov"><div class="card modal${wide?' wide':''}">${html}</div></div>`;
  if(!noClose) $('#ov').onclick = e=>{ if(e.target.id==='ov') closeOverlay(); };
}
function closeOverlay(){ $('#overlayRoot').innerHTML=''; }

function handleErr(e){
  if(/Phiên đã hết hạn/.test(e.message)){ clearSession(); USER=null; showLogin(); }
  toast(e.message, true);
}

init();
</script>
</body>
</html>
